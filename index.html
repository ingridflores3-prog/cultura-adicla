        { h: "Cuando identifica talento, lo visibiliza sin importar el género.", n: "Recomendar solo a personas de su mismo género." },
        { h: "Si escucha un comentario que discrimina por género, lo señala con respeto.", n: "Callar ante comentarios sexistas porque «fue una broma»." },
        { h: "Trata a cada socia con el mismo tiempo y profundidad que a cada socio.", n: "Asumir que la socia tiene menor capacidad o menor interés en los detalles." }
      ],
      programa: { d: "Programa de Liderazgo ADICLA: 5 meses, una sesión presencial de máximo 2 horas al mes más práctica diaria, formato híbrido para todas las agencias. Participan mujeres en roles operativos, administrativos y comerciales con potencial de crecimiento. Talento Humano coordina; los líderes acompañan y visibilizan.",
        modulos: ["Reconocer mi potencial", "Superar mis barreras internas", "Fortalecer mis habilidades", "Proyectar mi liderazgo"] },
      roles: ["lider", "gerencia", "asesor", "ventanilla"] },
    { id: "ciclo", grupo: "Cultura viva", n: "Capacitación, reconocimiento y salida", lead: "La cultura comienza el día que alguien llega y no termina cuando se va.", tipo: "lista",
      items: [
        { t: "Formación en valores y cultura", d: "Una vez al año, en todas las agencias, una reunión para revisar el manual: cómo lo estamos viviendo y qué situaciones pusieron a prueba los valores." },
        { t: "Formación en liderazgo", d: "Líderes y supervisores reciben formación continua en los atributos del manual, con acompañamiento, no como taller de un día." },
        { t: "Formación técnica y en género", d: "Talento Humano gestiona la capacitación técnica. Todo el personal recibe la formación en violencia de género e igualdad, repetida cuando hay contratación significativa." },
        { t: "Reconocimiento en el día a día", d: "El líder menciona en voz alta cuando alguien hizo algo bien: la forma en que atendió a un socio difícil o reportó un problema a tiempo." },
        { t: "Reconocimiento en la reunión mensual", d: "Un momento fijo para reconocer al menos una situación donde alguien demostró los valores de manera sobresaliente." },
        { t: "Reconocimiento anual (octubre)", d: "Reconocimiento público a personas y agencias. Cuando una colaboradora asume un nuevo rol, se celebra públicamente." },
        { t: "Cuando alguien se va", d: "Entrevista de salida para entender la razón real. Si la salida es decisión institucional, se comunica con dignidad y honestidad. El líder agradece con sinceridad. Nunca se trata como un trámite más." }
      ], roles: ["lider", "gerencia"] },
    { id: "activacion", grupo: "Cultura viva", n: "Plan de activación: qué hace cada rol", lead: "Los primeros tres meses son los que más pesan. Si el manual no entra en la rutina, termina en un cajón.", tipo: "activacion",
      filas: [
        { r: "Gerente General", d1: "Entrega el manual en persona a cada líder con una sesión de contexto de 30 minutos.", s1: "Visita al menos dos agencias y pregunta: ¿qué parte del manual ya están poniendo en práctica?", m1: "En la reunión mensual de líderes dedica 20 minutos a una situación real donde la cultura funcionó o donde hay brecha." },
        { r: "Líder de agencia", d1: "Lee completa la sección de liderazgo. Identifica el atributo que más necesita trabajar.", s1: "Presenta el manual al equipo: cuenta qué hay en él y por qué importa. Entrega una copia a cada colaborador.", m1: "En cada reunión semanal dedica 5 minutos a un comportamiento del manual: lo nombra, lo ejemplifica y pregunta cómo lo están viviendo." },
        { r: "Asesor / asesora de crédito", d1: "Lee valores y principios de conducta. Marca los que ya practica y los que quiere mejorar.", s1: "Elige un comportamiento para practicar esa semana y lo comparte con su jefe.", m1: "Identifica una situación real donde aplicó algo del manual, lista para la próxima reunión de equipo." },
        { r: "Ventanilla y operaciones", d1: "Lee el estándar de servicio y los cinco momentos del servicio.", s1: "Identifica cuál de los cinco momentos le resulta más difícil y lo habla con su líder.", m1: "Practica el protocolo de atención al socio molesto al menos una vez de manera consciente y lo comenta con el equipo." }
      ],
      viva: ["Los colaboradores mencionan los valores en conversaciones del día a día, sin que nadie se los pida.", "Los líderes resuelven situaciones difíciles citando criterios del manual.", "Cuando alguien comete un error, la primera conversación es sobre el proceso, no sobre quién falló.", "Las reuniones incluyen al menos un reconocimiento específico, con nombre y situación concreta.", "Los nuevos colaboradores reciben el manual el primer día y alguien les dedica tiempo para explicarlo.", "Las situaciones difíciles con socios se resuelven de manera consistente en todas las agencias."],
      engavetado: ["Nadie menciona los valores fuera de las reuniones donde se les pide hacerlo.", "Los conflictos se resuelven solo con criterio personal, sin referencia al manual.", "Los nuevos colaboradores no saben que existe un manual al tercer día de trabajo.", "Las reuniones son solo operativas; nadie abre espacio para hablar de cómo estamos trabajando juntos.", "El mismo tipo de situación difícil se resuelve de manera distinta en distintas agencias."],
      roles: ["gerencia", "lider", "asesor", "ventanilla"] },
    { id: "comite", grupo: "Cultura viva", n: "Comité de Talento y Cultura", lead: "Espacio de análisis con capacidad real de propuesta y ajuste, no un comité de cumplimiento.", tipo: "lista",
      items: [
        { t: "Integrantes", d: "Gerente General, Jefe de Talento Humano, dos representantes de agencias (rotación semestral) y una representante de las colaboradoras mujeres. Composición revisable cada año." },
        { t: "Qué revisa (trimestral)", d: "Estado de los ejes con mayor riesgo, avance de los cuatro compromisos de género, señales de alerta reportadas por agencias y propuestas de ajuste al manual." },
        { t: "Qué produce", d: "Acuerdos documentados de ajuste o refuerzo, reporte semestral a la Junta Directiva y actualizaciones al manual cuando la experiencia lo justifica." }
      ], roles: ["gerencia"] }
  ],

  situaciones: [
    { id: "cuota-error", t: "Descubro un error en la cuota que ya le expliqué al socio", roles: ["asesor"], tema: "Honestidad", ref: "Valor: Honestidad",
      caso: "Son las 4 de la tarde. Estás cerrando el expediente de renovación de don Mateo y notas que la cuota mensual que le explicaste la semana pasada tiene un error de cálculo. La firma ya está agendada para mañana.",
      op: [
        { t: "Lo llamas esa misma tarde, le explicas el error y le das la cifra correcta.", ok: true, f: "Comunicamos con honestidad, oportunidad y completitud. En el manual, don Mateo llega a la firma de todas formas y dice «gracias por avisarme». ADICLA no ganó nada con esa llamada, pero tampoco perdió lo único que importa: la confianza del socio." },
        { t: "Dejas pasar el detalle; mañana en la firma se ajusta la cifra y listo.", f: "Esto es entregar al socio solo la información que conviene para cerrar el crédito. El socio tiene derecho a saber hoy lo que cambió, no a enterarse cuando ya está firmando." },
        { t: "Esperas a ver si don Mateo nota la diferencia; si pregunta, se lo explicas.", f: "No omitimos lo incómodo ni adornamos lo que falla. Avisar antes de que el socio pregunte es lo que sostiene la confianza." }
      ], clave: "Comunicamos con honestidad, oportunidad y completitud. No omitimos lo incómodo. No adornamos lo que falla." },
    { id: "tres-expedientes", t: "Encontré un error en expedientes ya procesados y nadie lo ha notado", roles: ["lider"], tema: "Responsabilidad", ref: "Valor: Responsabilidad",
      caso: "Jueves por la tarde. Descubres que en tres expedientes de la semana pasada se saltó el paso de verificación de garantías por la carga del día. La revisión mensual es en dos semanas y nadie lo ha notado.",
      op: [
        { t: "Documentas los tres casos, llamas al supervisor regional esa misma tarde y le presentas el problema con una propuesta de corrección.", ok: true, f: "Asumes lo que pasó y lideras la solución. No esperas a que la auditoría lo encuentre ni buscas a quién culpar." },
        { t: "Esperas: faltan dos semanas y puede que la revisión no lo detecte.", f: "Esperar a que auditoría o el jefe encuentren el error «para ver si pasa desapercibido» es lo que el manual describe como lo que el colaborador no hace, y menos un líder." },
        { t: "Identificas quién procesó cada expediente y lo señalas en la reunión del equipo para que no se repita.", f: "El líder asume la responsabilidad ante la Gerencia y lidera la corrección sin señalar ni culpar a nadie públicamente. Transferir la culpa al equipo cuando hay una falla erosiona la cultura." }
      ], clave: "Cuando algo sale mal, no buscamos culpables: buscamos soluciones y aprendemos." },
    { id: "don-marcos", t: "El socio pide más crédito del que su negocio aguanta hoy", roles: ["asesor"], tema: "Compromiso social", ref: "Valor: Compromiso social",
      caso: "Llegas a casa de don Marcos para su tercera renovación. Quiere Q15,000 para ampliar su taller. En la conversación menciona, casi de paso, que su comprador principal se mudó a otra ciudad y las ventas todavía no se recuperan.",
      op: [
        { t: "Escuchas, haces preguntas y le propones Q8,000 con un plazo más cómodo, aunque al principio se resista.", ok: true, f: "Buscamos la solución financiera que se ajusta a la capacidad real del socio, no la que cierra la operación más rápido. En el manual, seis meses después don Marcos paga puntual y sin apuros. El crédito fue menos; el acompañamiento fue más." },
        { t: "Apruebas los Q15,000: cumple los criterios numéricos y es un socio con historial.", f: "Aprobar o rechazar únicamente por criterios numéricos, sin considerar el impacto real en la persona, es lo contrario del compromiso social. Un préstamo que la familia no puede pagar no es una oportunidad: es un problema." },
        { t: "Le ofreces el producto de mayor monto disponible, por si quiere aprovechar.", f: "Ofrecer el producto de mayor monto aunque no corresponda a la realidad y capacidad de pago del socio es una de las conductas que el manual marca como «lo que no hace»." }
      ], clave: "Trabajamos para que cada préstamo sea una oportunidad real de mejora de vida." },
    { id: "cierre-mes", t: "Es cierre de mes y el expediente llega incompleto", roles: ["lider"], tema: "Solidez", ref: "Valor: Solidez",
      caso: "Último viernes del mes. A la agencia le faltan dos operaciones para la meta. Llega un expediente con la documentación de garantía incompleta: falta una hoja de la escritura.",
      op: [
        { t: "Lo devuelves: «esto lo procesamos la semana que viene, completo».", ok: true, f: "Se prefiere retrasar una operación a permitir que pase incompleta. En el manual la hoja llega el miércoles, la operación sale sin observaciones y la cartera queda limpia. La agencia no llegó al número ese mes, pero hizo las cosas bien." },
        { t: "Lo apruebas hoy y pides que la hoja faltante se agregue la próxima semana.", f: "Aprobar atajos en el proceso cuando hay presión de tiempo o de resultados es lo que el manual señala como lo que el líder no hace. La confianza se sostiene con procesos correctos, sin excepciones." },
        { t: "Le pides al asesor que consiga una copia «de donde sea» para cerrar hoy.", f: "Operamos con solvencia, orden y rigor. Un atajo bajo presión de cierre compromete la solidez que el socio y los fondeadores depositan en ADICLA." }
      ], clave: "Operamos con solvencia, orden y rigor. Sin excepciones ni atajos." },
    { id: "dos-socios", t: "Llegan dos socios a la vez: uno pide Q28,000 y una señora Q3,500", roles: ["asesor", "ventanilla"], tema: "Equidad", ref: "Valor: Equidad",
      caso: "Martes. Llegan casi al mismo tiempo un hombre que pide Q28,000 para su ferretería y una señora que viene por un crédito de Q3,500.",
      op: [
        { t: "Los atiendes en orden de llegada, con el mismo tiempo y la misma profundidad de explicación.", ok: true, f: "Cuando la señora pregunta cómo funcionan las cuotas, lo explicas con calma, verificas que entendió y esperas su siguiente pregunta. Los dos salen sabiendo exactamente qué firmaron." },
        { t: "Atiendes primero al de la ferretería: es la operación más grande del día.", f: "Atender diferente según el monto, el idioma o la apariencia del socio rompe la equidad. El mismo trato y los mismos criterios para toda persona." },
        { t: "Despachas rápido a la señora, que es un trámite pequeño, para dedicarte al otro.", f: "El asesor dedica el mismo tiempo al crédito de Q3,000 de una señora de la comunidad que al de Q30,000 de un empresario urbano." }
      ], clave: "El mismo trato, las mismas oportunidades, los mismos criterios para toda persona." },
    { id: "campo-solo", t: "Estoy solo en campo y hay un campo del formulario que nadie llena", roles: ["asesor"], tema: "Integridad", ref: "Principio 4: Integridad sin condiciones",
      caso: "Son las 3 de la tarde. Llevas cuatro horas en campo y te quedan dos visitas. El expediente tiene un campo de verificación que casi nadie llena cuando está solo en una comunidad.",
      op: [
        { t: "Lo llenas completo, aunque nadie lo vaya a revisar hoy.", ok: true, f: "Cuando ADICLA dice que hace las cosas bien, las hace bien aunque no haya nadie mirando. La integridad no es para la auditoría: es para el expediente que nadie va a revisar." },
        { t: "Lo dejas vacío; acá nadie me ve y hay que avanzar.", f: "«Tomar atajos en el campo porque acá nadie me ve» es la conducta que el Principio 4 prohíbe expresamente." },
        { t: "Lo completas después en la oficina, de memoria.", f: "Aplicamos los mismos pasos del protocolo en campo, en ventanilla y en cualquier agencia, con o sin supervisión. Un dato llenado de memoria no es una verificación." }
      ], clave: "Actuamos con el mismo estándar ético cuando hay supervisión y cuando no la hay." },
    { id: "dona-rosa", t: "El crédito que prometí para el viernes no va a salir", roles: ["asesor", "ventanilla"], tema: "Responsabilidad", ref: "Principio 5: Responsabilidad hasta el final",
      caso: "Jueves, 5 de la tarde. Confirmas que el crédito de doña Rosa no va a salir el viernes como le prometiste.",
      op: [
        { t: "La llamas ahora, le dices que va a demorar unos días más y le explicas el motivo.", ok: true, f: "Doña Rosa no estará feliz, pero va a confiar en ADICLA. Si algo cambia, avisamos con tiempo suficiente." },
        { t: "Esperas a mañana a ver si se resuelve antes de que ella llame.", f: "Cuando vemos que algo no va a resultar como se planeó, lo comunicamos de inmediato; no esperamos a que sea una crisis." },
        { t: "No dices nada: reportar el atraso puede tener consecuencias para ti.", f: "Guardar silencio sobre un problema porque reportarlo puede tener consecuencias es justo lo que el Principio 5 marca como lo que nunca hacemos." }
      ], clave: "Terminamos lo que empezamos. Si algo cambia, avisamos con tiempo suficiente para que alguien más pueda actuar." },
    { id: "grupo-solidario", t: "Voy a presentar la renovación a un grupo solidario en la comunidad", roles: ["asesor"], tema: "Pertinencia cultural", ref: "Principio 6: Pertinencia cultural",
      caso: "Visitas a un grupo solidario para la renovación. Varias de las señoras prefieren hablar en su idioma entre ellas antes de decidir.",
      op: [
        { t: "Preguntas primero cómo está la comunidad, reconoces a cada miembro por su nombre y haces espacio para que conversen en su idioma antes de decidir. No las apresuras.", ok: true, f: "Servir bien significa adaptar la forma, nunca el estándar de calidad, a la realidad de cada persona." },
        { t: "Presentas las condiciones de una vez y pides la decisión hoy; hay más visitas pendientes.", f: "Tratar con menos paciencia a socios cuyas prácticas o idioma son distintos erosiona la pertinencia cultural y la equidad." },
        { t: "Explicas en español y, como nadie pregunta, das por entendido y cierras.", f: "Dar por cerrada una atención porque el socio no preguntó, asumiendo que entendió todo, es lo que nunca hacemos. Verificamos que comprendió antes de concluir." }
      ], clave: "Adaptamos la forma, nunca el estándar de calidad, a la realidad de cada persona." },
    { id: "socio-molesto", t: "Un socio llega molesto y en voz alta", roles: ["ventanilla", "asesor"], tema: "Servicio", ref: "Cuando el socio tiene una queja", herr: "queja",
      caso: "Son las 11 de la mañana. Un señor entra a la agencia molesto y en voz alta: lleva tres semanas esperando y nadie le llamó.",
      op: [
        { t: "Lo dejas terminar sin interrumpir, le dices que tiene razón, que tres semanas sin noticias no es lo que ADICLA debe hacer, y buscas ahora mismo a quién puede resolverlo.", ok: true, f: "Escuchar, reconocer, resolver o escalar, y dar seguimiento. Un socio que se queja está eligiendo darnos la oportunidad de corregir en lugar de irse." },
        { t: "Le explicas que eso no es de tu área y que el asesor no está.", f: "Defenderse, minimizar la queja o trasladar la culpa a otra área o persona es lo que el protocolo prohíbe en el paso 2." },
        { t: "Le prometes que mañana sale su crédito, para que se calme.", f: "Prometer una solución sin saber si se puede cumplir rompe la confianza una segunda vez. Si no puedes resolver, explica a quién va el caso y en qué plazo recibirá respuesta." }
      ], clave: "Escuchar sin interrumpir · Reconocer · Resolver o escalar · Dar seguimiento" },
    { id: "socio-conocido", t: "Llega a la agencia un socio que lleva dos años con ADICLA", roles: ["ventanilla", "asesor"], tema: "Servicio", ref: "Estándar de servicio al socio", herr: "servicio",
      caso: "Entra a la agencia un socio que conoces desde hace dos años. Hace poco abrió un nuevo punto de venta.",
      op: [
        { t: "Lo saludas por su nombre, le preguntas por el nuevo punto de venta y después pasas al trámite.", ok: true, f: "La atención comienza con el nombre del socio, no con el número de expediente. La cercanía es profesional y genuina: recordar su negocio, no leerlo del expediente." },
        { t: "Le pides el DPI y el número de crédito de una vez para agilizar la fila.", f: "Comenzar la atención pidiendo documentos antes de reconocer a la persona es lo primero que el estándar de servicio marca como lo que nunca hacemos." },
        { t: "Lo atiendes con cortesía general, como a cualquier persona que no conoces.", f: "Si conocemos al socio, lo saludamos por su nombre antes de preguntar por el trámite. El socio siente que es una persona, no un trámite." }
      ], clave: "Saludo al socio por su nombre si lo conozco, antes de preguntar por el trámite." },
    { id: "kaqchikel", t: "Llega una socia que solo habla kaqchikel y hay fila", roles: ["ventanilla", "asesor"], tema: "Equidad", ref: "Principio 1: Trato digno · Valor: Equidad",
      caso: "Llega a la agencia una socia que solo habla kaqchikel. Hay fila y la comunicación va a tomar más tiempo.",
      op: [
        { t: "Buscas activamente la manera de comunicarte con respeto y claridad, y le das el tiempo que necesita.", ok: true, f: "Cuando hay barrera de idioma, buscamos cómo comunicarnos antes de proceder con cualquier trámite. No la atendemos de prisa porque la comunicación toma más tiempo." },
        { t: "La atiendes rápido con señas y formularios, para no detener la fila.", f: "Apurar la atención de un socio porque la comunicación en su idioma toma más tiempo es una conducta que el manual marca como lo que nunca hacemos, en el Principio 1 y en el valor Equidad." },
        { t: "Le pides que regrese otro día con alguien que hable español.", f: "Somos de los territorios que servimos; entendemos el idioma y el ciclo de vida de las comunidades. La responsabilidad de comunicarse es nuestra, no del socio." }
      ], clave: "Cuando hay barrera de idioma, busco activamente cómo comunicarme antes de proceder." },
    { id: "saldo-memoria", t: "Un socio pregunta por el estado de su crédito y hay prisa", roles: ["ventanilla", "asesor"], tema: "Solidez", ref: "Valor: Solidez",
      caso: "Un socio pregunta por el saldo y el estado de su crédito. Hay varias personas esperando y tú más o menos recuerdas su caso.",
      op: [
        { t: "Consultas el sistema y le das la información exacta y documentada.", ok: true, f: "Damos información exacta, documentada y consistente con lo que aparece en el sistema." },
        { t: "Le das la cifra aproximada de memoria para no tardar en responder.", f: "Dar información de memoria o aproximada para no tardar en responder es lo que el valor Solidez marca como lo que no hacemos." }
      ], clave: "Información exacta, documentada y consistente con el sistema." },
    { id: "historial", t: "El socio reunió sus documentos con esfuerzo y hay un problema en su historial", roles: ["asesor"], tema: "Honestidad", ref: "Principio 2: Honestidad completa",
      caso: "Un socio llega con su esposa y los documentos ordenados en una carpeta; le costó dos semanas reunirlos. Revisas el expediente y ves un problema en el historial.",
      op: [
        { t: "Le explicas con calma exactamente qué pasó, qué puede hacer para mejorar su perfil y le agendas una nueva cita en seis semanas.", ok: true, f: "El socio sale sin el crédito, pero con un plan y con confianza en ADICLA. Decimos la verdad aunque sea incómoda." },
        { t: "Le dices que «hubo un detalle en el sistema» y que vuelva otro día, para no entrar en lo incómodo.", f: "Guardar información porque compartirla es incómodo deja al socio sin saber qué corregir. La honestidad completa incluye lo que no queremos decir." },
        { t: "Avanzas el trámite sin mencionar el historial, para que no pierda el viaje.", f: "Omitir lo difícil para que el socio firme ese día es lo que el Principio 2 marca como lo que nunca hacemos." }
      ], clave: "Decimos la verdad aunque sea incómoda. No omitimos información para quedar bien ni para cerrar más rápido." },
    { id: "error-companero", t: "Me doy cuenta de que un compañero cometió un error", roles: ["asesor", "ventanilla", "lider"], tema: "Apoyo al compañero", ref: "Principio 3: Apoyo al compañero",
      caso: "Revisando un trámite notas que un compañero cometió un error en un expediente. Nadie más lo ha visto todavía.",
      op: [
        { t: "Se lo dices directamente a él y lo apoyas para corregirlo.", ok: true, f: "Cuando un compañero comete un error, lo apoyamos para corregirlo; no lo exponemos ante el equipo." },
        { t: "Lo comentas en el grupo de WhatsApp para que todos aprendan.", f: "Señalar el error de un compañero públicamente antes de hablarlo con él directamente es lo que el Principio 3 marca como lo que nunca hacemos. Además, el WhatsApp grupal nunca se usa para correcciones." },
        { t: "No es tu expediente; terminas lo tuyo y te desconectas.", f: "En ADICLA no se trabaja en silos. Lo que le pasa a un compañero o a otra agencia nos concierne a todos." }
      ], clave: "Cuando un compañero comete un error, lo apoyo para corregirlo; no lo expongo ante el equipo." },
    { id: "dilema-etico", t: "Tengo un dilema ético y el caso no es claro", roles: ["asesor", "ventanilla"], tema: "Integridad", ref: "Principio 4: Integridad sin condiciones",
      caso: "Un socio conocido te pide algo que no está claramente permitido ni claramente prohibido en el procedimiento. Nadie está supervisando y decidirlo tú solo sería lo más cómodo.",
      op: [
        { t: "Consultas a tu líder antes de actuar.", ok: true, f: "Cuando enfrentamos un dilema ético, consultamos al líder antes de actuar por conveniencia." },
        { t: "Decides lo que te conviene; el caso no es claro y nadie lo va a cuestionar.", f: "Decidir solo lo que conviene sin consultar cuando el caso no es claro es lo que el Principio 4 marca como lo que nunca hacemos." }
      ], clave: "Cuando enfrento un dilema ético, consulto a mi líder antes de actuar por conveniencia." },
    { id: "tres-pagos-tarde", t: "Tres socios del mismo grupo pagaron tarde este mes", roles: ["asesor"], tema: "Riesgos", ref: "Eje 2: Gestión de riesgos",
      caso: "Notas que tres socios del mismo grupo solidario pagaron tarde en el mismo mes, algo que no había pasado antes.",
      op: [
        { t: "Lo registras y lo llevas a tu jefe ese mismo día para revisar el patrón juntos.", ok: true, f: "En el manual descubren que los tres tienen sus negocios en el mismo mercado, que estuvo cerrado una semana. Lo atienden antes del siguiente vencimiento y el grupo no se fractura. Reportar un riesgo temprano es un acto de integridad." },
        { t: "Esperas al siguiente vencimiento a ver si se repite.", f: "Esperar a que la auditoría identifique algo que era visible en el trabajo cotidiano erosiona la gestión de riesgos." },
        { t: "No es tu área; eso lo ve la gente de riesgos y auditoría.", f: "Tratar la gestión de riesgos como responsabilidad exclusiva del área de control es lo que el Eje 2 marca como conducta que erosiona la cultura." }
      ], clave: "Cuando cualquier persona reporta un riesgo temprano, está haciendo un acto de integridad." },
    { id: "origen-fondos", t: "El socio viene referido por alguien de confianza, pero el origen de fondos no cuadra", roles: ["asesor"], tema: "Cumplimiento", ref: "Eje 7: Cumplimiento (LDFT)",
      caso: "Estás en la visita final con un socio referido por uno de los socios más antiguos de la agencia. Es amable y la referencia es de confianza. Pero algo en la declaración de origen de fondos no cuadra.",
      op: [
        { t: "Esa misma tarde reportas la inconsistencia a tu jefe siguiendo el protocolo.", ok: true, f: "Esa decisión protege a ADICLA y protege al socio. Cumplimos porque somos íntegros, no solo porque nos auditan." },
        { t: "Confías en la referencia y sigues con el trámite; es gente conocida.", f: "Reportar de manera diferente según quién sea el socio involucrado, u omitir pasos por la relación con el socio, es lo que el Eje 7 marca como conducta que erosiona el cumplimiento." },
        { t: "Esperas a ver si se aclara solo en el siguiente paso.", f: "Cuando identificamos una transacción inusual la reportamos de inmediato, independientemente de quién sea el socio." }
      ], clave: "Cumplimos los protocolos de LDFT con la misma exactitud cuando hay supervisión que cuando no la hay." },
    { id: "herramienta-nueva", t: "No entiendo el sistema nuevo y los demás ya lo usan", roles: ["asesor", "ventanilla"], tema: "Tecnología", ref: "Eje 4: Transformación digital y tecnología",
      caso: "ADICLA lanzó un nuevo sistema de gestión de cartera. Otros compañeros ya lo usan con soltura y tú todavía abres el manual a cada paso.",
      op: [
        { t: "Pides ayuda a un compañero que ya lo domina.", ok: true, f: "Si no se entiende una herramienta nueva, se pide ayuda. Eso no es debilidad: es responsabilidad profesional." },
        { t: "Sigues como siempre lo has hecho; el sistema anterior funcionaba.", f: "Resistir los cambios con «siempre lo hemos hecho así» erosiona el eje de tecnología. Cada herramienta nueva es para servir mejor al socio." },
        { t: "Disimulas y lo vas descubriendo solo, para que no piensen que no puedes.", f: "Nadie se queda atrás sin acompañamiento, y pedir ayuda es parte de la cultura, no una falla." }
      ], clave: "Si no se entiende una herramienta nueva, se pide ayuda. No es debilidad: es responsabilidad profesional." },
    { id: "comentario-sexista", t: "En la reunión alguien hace una «broma» sobre las mujeres", roles: ["asesor", "ventanilla", "lider", "gerencia"], tema: "Género", ref: "Género en el día a día", herr: "genero",
      caso: "En una reunión de equipo, un compañero hace una broma que descalifica a las mujeres para el trabajo de campo. Varios se ríen.",
      op: [
        { t: "Lo señalas directamente y con respeto, en el momento.", ok: true, f: "Si escuchamos un comentario que discrimina a alguien por su género, lo señalamos directamente y con respeto." },
        { t: "Lo dejas pasar: fue una broma y siempre se ha hablado así.", f: "Callar ante comentarios sexistas «porque siempre se ha hablado así o porque fue una broma» es lo que el manual marca como conducta que ningún colaborador de ADICLA tiene." }
      ], clave: "Si escucha un comentario que discrimina a alguien por su género, lo señala directamente y con respeto." },
    { id: "acoso-consejo", t: "Una compañera me cuenta que un superior la está acosando", roles: ["asesor", "ventanilla", "lider", "gerencia"], tema: "Género", ref: "Compromiso 4: Prevención de violencia de género y acoso", herr: "denuncia",
      caso: "Una compañera te cuenta, en confianza, que una persona con cargo superior la está acosando. Te pide consejo.",
      op: [
        { t: "La orientas al canal confidencial de Talento Humano y cuidas su confidencialidad.", ok: true, f: "La persona afectada o testigo reporta al canal confidencial de Talento Humano; Talento Humano acusa recibo en 48 horas y asigna a quien investiga. Ningún cargo da inmunidad." },
        { t: "Le sugieres dejarlo pasar: él tiene cargo y puede ser peor para ella.", f: "Disuadir a alguien de reportar y proteger a alguien por su cargo son dos de las cuatro conductas que el protocolo prohíbe expresamente." },
        { t: "Lo cuentas al resto del equipo para que la apoyen.", f: "Revelar la identidad de quien reporta está prohibido. La confidencialidad es lo que permite que la gente reporte sin temor." }
      ], clave: "Nunca disuadir de reportar, revelar la identidad de quien reportó, tomar represalias ni proteger a alguien por su cargo." },
    { id: "cambio-requisitos", t: "Gerencia me comunica un cambio y la reunión semanal es hasta el lunes", roles: ["lider"], tema: "Comunicación", ref: "Atributo 5: Comunica con claridad y oportunidad",
      caso: "A mediodía recibes de Gerencia un cambio en los requisitos de aprobación de créditos. La reunión semanal del equipo es hasta el lunes.",
      op: [
        { t: "A las 2 de la tarde reúnes al equipo, explicas el cambio, el contexto y cómo afecta su trabajo ese mismo día.", ok: true, f: "Nadie descubre el cambio cuando un crédito le rebota. Toda comunicación importante llega al equipo en menos de 24 horas, con contexto." },
        { t: "Lo guardas para la reunión del lunes; ahí lo explicas con calma.", f: "Que el equipo se entere por rumor o días después de que el jefe ya lo sabía es la señal de alerta del Estándar mínimo 3." },
        { t: "Reenvías el correo al grupo de WhatsApp sin más explicación.", f: "Comunicar decisiones con «así lo decidió la institución, punto», sin el contexto completo, es lo que el líder ADICLA nunca hace." }
      ], clave: "Cuando llega información que afecta al equipo, la comparte dentro de las 24 horas, con el contexto completo." },
    { id: "convocatoria-interna", t: "Identifico talento en una asesora y se abre una convocatoria interna", roles: ["lider"], tema: "Desarrollo", ref: "Atributo 2: Desarrolla a su equipo", herr: "desarrollo",
      caso: "En la conversación de desarrollo, una asesora de tu equipo te cuenta hacia dónde quiere crecer. Hay una convocatoria interna próxima y ella reúne el perfil. Es, además, una de tus mejores personas.",
      op: [
        { t: "Le dices que reúne el perfil, la recomiendas y lo comunicas a coordinación y Talento Humano.", ok: true, f: "Un líder no acapara talento: lo identifica, lo visibiliza y lo impulsa. En el manual, la asesora sale de esa reunión diferente." },
        { t: "No se lo mencionas: la necesitas en tu agencia.", f: "Retener al mejor colaborador «porque lo necesito acá» aunque la persona quiera crecer es lo que el Atributo 2 marca como lo que el líder nunca hace." },
        { t: "Esperas a que ella misma pregunte por la convocatoria; si le interesa, lo dirá.", f: "Con las colaboradoras, el líder pregunta activamente; no asume que no quieren ascender porque no lo han dicho." }
      ], clave: "Tiene al menos una conversación de desarrollo por semestre con cada miembro de su equipo y visibiliza el talento." },
    { id: "cambio-horario", t: "Coordinación va a cambiar el horario de atención de mi agencia", roles: ["lider"], tema: "Participación", ref: "Atributo 3: Garantiza la participación del equipo",
      caso: "Coordinación decide cambiar el horario de atención de tu agencia. Todavía no está confirmado; faltan dos días.",
      op: [
        { t: "Convocas al equipo antes de que se confirme, compartes la propuesta, escuchas sus inquietudes y las llevas a coordinación.", ok: true, f: "La consulta es real: ocurre antes de que la decisión esté tomada, no después." },
        { t: "Esperas la confirmación y luego informas al equipo el nuevo horario.", f: "Decidir los cambios y luego «informar» al equipo como si hubieran participado es lo que el Atributo 3 marca como lo que el líder nunca hace." },
        { t: "Lo comunicas como «así lo decidió coordinación» y pasas al siguiente punto.", f: "Comunicar decisiones difíciles con «así lo decidió la institución, punto» no es comunicar: es cerrar la puerta a la voz del equipo." }
      ], clave: "Antes de cambiar algo en cómo trabaja la agencia, consulta al equipo. La consulta ocurre antes de que la decisión esté tomada." },
    { id: "expediente-auditoria", t: "Un expediente de mi agencia llegó incompleto a auditoría", roles: ["lider"], tema: "Error y aprendizaje", ref: "Atributo 4: Gestiona el error con aprendizaje", herr: "error",
      caso: "Auditoría te informa que un expediente de tu agencia llegó incompleto. Sabes quién lo procesó.",
      op: [
        { t: "Reúnes al equipo y haces una sola pregunta: ¿en qué parte del proceso nos falló la revisión?", ok: true, f: "En el manual identifican un paso que se salta cuando hay mucha carga y lo ajustan juntos. No hubo señalados; hubo un proceso mejor." },
        { t: "Llamas a quien lo procesó y le pides explicaciones frente al equipo, para que sirva de ejemplo.", f: "Llamar la atención frente al equipo está prohibido en el protocolo de error operativo y en el Estándar mínimo 2. Toda retroalimentación ocurre en privado." },
        { t: "Aplicas la consecuencia a quien se equivocó y sigues adelante.", f: "Sancionar y seguir sin ajustar el proceso que generó el error deja el error vivo. Primero: ¿qué pasó y por qué? Después: ¿qué cambiamos?" }
      ], clave: "La primera pregunta no es ¿quién tiene la culpa? sino ¿qué pasó y cómo lo evitamos la próxima vez?" },
    { id: "llego-tarde", t: "Llegué ocho minutos tarde a la reunión que yo convoqué", roles: ["lider"], tema: "Ejemplo", ref: "Atributos 1 y 6 · Las normas aplican para todos",
      caso: "Llegas ocho minutos tarde a la reunión de tu equipo. Todos ya están sentados. En tu agencia la hora de llegada de cada persona se anota en el libro de actas.",
      op: [
        { t: "Pides disculpas sin excusas y anotas tu hora de llegada en el libro, igual que se hace con cualquier otra persona.", ok: true, f: "Es el ejemplo de don Armando en el manual: en esa agencia las normas no son algo que el jefe pide, sino algo que el jefe hace." },
        { t: "Sigues con la agenda; el jefe tiene razones y no hace falta anotarlo.", f: "Exigir puntualidad al equipo y llegar tarde uno mismo sin reconocerlo transmite cinismo, no cultura. Las normas aplican igual al jefe que al equipo." },
        { t: "Explicas que fue por una llamada de Gerencia y lo dejas ahí.", f: "Minimizar los propios errores con excusas mientras se exige responsabilidad al equipo es lo que el Atributo 1 marca como lo que el líder nunca hace." }
      ], clave: "El líder que exige lo que él mismo no practica no transmite cultura, transmite cinismo." },
    { id: "trato-desigual", t: "Una colaboradora me dice que siente trato desigual", roles: ["lider"], tema: "Equidad", ref: "Atributo 6: Aplica las normas con equidad",
      caso: "Una colaboradora te dice que siente que se le asignan las visitas más lejanas y que se le exige más que a sus compañeros.",
      op: [
        { t: "La atiendes con seriedad, revisas los hechos y actúas sobre lo que encuentres.", ok: true, f: "Cuando alguien señala una situación de trato desigual, el líder la atiende con seriedad y sin minimizarla." },
        { t: "Le dices que no es para tanto, que es muy sensible.", f: "Ignorar una queja de trato inequitativo porque la persona «es muy sensible» es lo que el Atributo 6 marca como lo que el líder nunca hace." },
        { t: "Lo pones sobre la mesa en la reunión de equipo para que todos opinen.", f: "Un señalamiento de trato desigual se atiende con seriedad y en privado; exponerlo al grupo puede castigar a quien lo reportó. Si se reportan diferencias de trato, Talento Humano y el Comité actúan dentro de 30 días." }
      ], clave: "Las normas aplican de la misma manera a todas las personas. La posición o la antigüedad no generan inmunidad." },
    { id: "conflicto-equipo", t: "Dos personas de mi equipo ya no se hablan", roles: ["lider"], tema: "Conflicto", ref: "Protocolos para momentos críticos", herr: "conflicto",
      caso: "Dos asesores de tu agencia tuvieron un roce hace una semana y ya no se hablan. El ambiente se siente.",
      op: [
        { t: "Escuchas a cada uno por separado antes de tomar posición, identificas el origen real y después facilitas una conversación conjunta orientada a la solución.", ok: true, f: "Y en 15 días haces seguimiento para verificar que mejoró y que no hay represalias." },
        { t: "Los reúnes de inmediato para que lo resuelvan frente a ti y se decida quién tiene razón.", f: "Tomar partido antes de escuchar a las dos partes, y orientar la conversación a quién tiene razón en lugar de a la solución, es lo que el protocolo prohíbe." },
        { t: "Dejas que se les pase; son adultos.", f: "Ignorar señales de tensión hasta que se convierta en ruptura es lo que el protocolo marca con NUNCA." }
      ], clave: "Escuchar por separado · Identificar el origen real · Conversación conjunta hacia la solución · Seguimiento en 15 días" },
    { id: "lider-nuevo", t: "Llego a liderar una agencia nueva", roles: ["lider"], tema: "Liderazgo", ref: "Cuando el líder llega nuevo a una agencia", herr: "lider-nuevo",
      caso: "Te asignan una agencia nueva. Tienes ideas claras de lo que funcionó en tu agencia anterior y ves cosas que cambiarías desde el primer día.",
      op: [
        { t: "Los primeros 30 días solo escuchas, observas y preguntas; sin cambios todavía.", ok: true, f: "El equipo tiene historia y conocimiento que necesitas antes de actuar. Días 30 a 60: reconoces en público lo que ya hacen bien. Días 60 a 90: primeros cambios con el equipo, no a pesar de él." },
        { t: "Aplicas desde el primer día lo que funcionó en tu agencia anterior.", f: "Llegar aplicando lo que funcionó en tu agencia anterior sin entender la nueva realidad es el NUNCA de este protocolo." },
        { t: "Reconoces lo bueno la primera semana y arrancas los cambios en la segunda.", f: "El reconocimiento público va en los días 30 a 60 y los cambios en los días 60 a 90, con el equipo. Cambiar en la segunda semana es actuar antes de entender." }
      ], clave: "Días 1 a 30: solo escuchar · 30 a 60: reconocer lo que ya hacen bien · 60 a 90: primeros cambios con el equipo" },
    { id: "corregir-comportamiento", t: "Un asesor sigue entregando expedientes incompletos después de dos avisos", roles: ["lider"], tema: "Corrección", ref: "Cuando hay que corregir un comportamiento fuera del estándar", herr: "correccion",
      caso: "Un asesor de tu equipo sigue entregando expedientes incompletos después de dos avisos informales.",
      op: [
        { t: "En privado, describes el comportamiento concreto, explicas su impacto, le preguntas qué necesita para cumplir y acuerdan un cambio con plazo y seguimiento.", ok: true, f: "La corrección cultural no es sanción: es una conversación que le devuelve a la persona la responsabilidad sobre su comportamiento. Si cambió, lo reconoces; si no, escalas a Talento Humano." },
        { t: "Le dices que es irresponsable y que ya está advertido.", f: "Describir el comportamiento con etiquetas personales («eres irresponsable») está prohibido. Se describe el comportamiento específico, no la personalidad." },
        { t: "Lo mencionas en la reunión del equipo para que sirva de ejemplo a todos.", f: "Llamar la atención frente al equipo es el primer NUNCA de este protocolo y del Estándar mínimo 2." }
      ], clave: "En privado · Comportamiento concreto, no etiquetas · Impacto · ¿Qué necesitas? · Acuerdo con plazo · Seguimiento" },
    { id: "corregir-whatsapp", t: "Tengo que corregir a un asesor por un error de ayer", roles: ["lider"], tema: "Comunicación", ref: "Canales de comunicación · Estándar mínimo 2", herr: "canales",
      caso: "Ayer un asesor cometió un error en un trámite. Hoy tienes que corregirlo. El grupo de WhatsApp de la agencia está activo.",
      op: [
        { t: "Lo hablas con él en privado, cara a cara o por llamada.", ok: true, f: "Toda retroalimentación de desempeño ocurre en privado. La llamada directa es el canal cuando el tono importa y puede malinterpretarse por escrito." },
        { t: "Lo escribes en el grupo de WhatsApp para que todos tomen nota.", f: "El WhatsApp grupal nunca se usa para correcciones al equipo, y llamar la atención por grupo de WhatsApp es la señal de alerta del Estándar mínimo 2." },
        { t: "Lo dejas para la reunión mensual y lo mencionas ahí.", f: "Nunca se corrige a un colaborador frente al equipo: ni en la reunión, ni en el pasillo, ni por WhatsApp." }
      ], clave: "Nunca se corrige a un colaborador frente al equipo. La retroalimentación se da cara a cara." },
    { id: "sistema-nuevo-lider", t: "Lanzaron un sistema nuevo: dos lo dominan y cuatro no", roles: ["lider"], tema: "Tecnología", ref: "Eje 4: Transformación digital y tecnología",
      caso: "El lunes después del lanzamiento del nuevo sistema de cartera notas que dos asesores ya lo usan con soltura y cuatro todavía abren el manual a cada paso.",
      op: [
        { t: "Designas a los dos como referentes internos de la semana: cualquier duda va a ellos antes que a soporte.", ok: true, f: "En el manual, al viernes nadie llamó a soporte. El conocimiento se comparte y nadie se queda atrás sin acompañamiento." },
        { t: "Dejas que cada quien aprenda a su ritmo con el manual; es su responsabilidad.", f: "Dejar a colaboradores solos para que descubran nuevas herramientas sin acompañamiento erosiona el eje de tecnología." },
        { t: "Haces notar en la reunión quiénes van atrasados, para que se pongan las pilas.", f: "Criticar o ridiculizar a compañeros que tienen dificultades con herramientas tecnológicas es una conducta que erosiona la cultura." }
      ], clave: "Cuando se introduce una herramienta nueva, quienes tienen más experiencia apoyan activamente a quienes están aprendiendo." },
    { id: "reunion-lunes-numeros", t: "Es la reunión del lunes y tengo los números listos", roles: ["lider"], tema: "Desempeño social", ref: "Eje 5: Desempeño social y ambiental",
      caso: "Reunión del lunes. Tienes los indicadores del mes listos para la pizarra. Sabes, además, que una socia que recibió su primer crédito el año pasado acaba de abrir su segundo punto de venta.",
      op: [
        { t: "Pones los números y dedicas 5 minutos a contar la historia de la socia: «eso también somos nosotros».", ok: true, f: "El equipo escucha diferente que cuando escucha indicadores. El líder hace explícita la conexión entre los resultados y el impacto en las familias." },
        { t: "Solo revisas los números; la reunión es para resultados.", f: "Tratar la misión social como lenguaje de posicionamiento, desconectada del trabajo cotidiano, erosiona el Eje 5." },
        { t: "Felicitas únicamente a quien tiene la cartera más grande.", f: "Reconocer exclusivamente resultados financieros e ignorar la calidad del acompañamiento comunitario es lo que el Eje 5 marca como conducta que erosiona." }
      ], clave: "En cada reunión, el líder hace explícita la conexión entre los resultados de la agencia y el impacto en las familias." },
    { id: "primer-dia", t: "Hoy llega un colaborador nuevo a mi agencia", roles: ["lider"], tema: "Inducción", ref: "Momento 1: Inducción, los primeros 90 días", herr: "induccion",
      caso: "Son las 7:55. Carlos llega a su primer día en la agencia. Tienes la mañana llena.",
      op: [
        { t: "Lo recibes por su nombre, lo presentas a cada compañero, le das el Manual de Cultura antes que el de procedimientos y por la tarde lo llevas a conocer el territorio y a dos socios antiguos.", ok: true, f: "«Lee esto con calma: no es un trámite, es para que entiendas por qué trabajamos como trabajamos.» El líder le asigna además un par de referencia para las primeras semanas." },
        { t: "Le entregas el manual de procedimientos y le pides que lo lea mientras te desocupas.", f: "Entregar el manual y asumir que el nuevo colaborador lo leerá por su cuenta y lo entenderá es lo que el líder nunca hace. Primero el Manual de Cultura, explicado con tus propias palabras." },
        { t: "Como ya trabajó en otra financiera, lo pones a operar de una vez.", f: "Asumir que porque trabajó antes en finanzas ya conoce la cultura de ADICLA es un error de inducción. El nuevo colaborador observa antes de operar." }
      ], clave: "El líder directo recibe personalmente al nuevo colaborador. Manual de Cultura antes que el de procedimientos." },
    { id: "reconocer-paula", t: "Alguien del equipo hizo algo bien y nadie lo ha mencionado", roles: ["lider"], tema: "Reconocimiento", ref: "Momento 3: Reconocimiento institucional", herr: "ciclo",
      caso: "La semana pasada Paula mantuvo la confianza de un grupo solidario que estaba a punto de fracturarse: con calma, con honestidad y sin prometer lo que no podía cumplir. Nadie lo ha mencionado.",
      op: [
        { t: "En la reunión del lunes cuentas, en detalle y con su nombre, lo que hizo y por qué eso es exactamente lo que ADICLA quiere.", ok: true, f: "En el manual, Paula mira la mesa, alguien aplaude y el resto sigue. Ese momento vale más que cualquier certificado." },
        { t: "Lo guardas para el reconocimiento anual de octubre.", f: "El reconocimiento ocurre en el día a día y en la reunión mensual, no solo en octubre. Las reuniones incluyen al menos un reconocimiento específico, con nombre y situación concreta." },
        { t: "Reconoces en la reunión a quien más desembolsó este mes.", f: "Se reconoce al personal que va más allá en el acompañamiento, no solo a quien tiene la cartera más grande." }
      ], clave: "Reconocimiento con nombre y situación concreta: en el día a día, en la reunión mensual y en octubre." },
    { id: "cancelar-reunion", t: "Hay demasiado trabajo este mes: ¿cancelo la reunión mensual?", roles: ["lider"], tema: "Liderazgo", ref: "Los cinco estándares mínimos", herr: "reunion",
      caso: "Este mes la agencia está saturada. Alguien propone cancelar la reunión mensual de equipo y retomarla el próximo mes.",
      op: [
        { t: "La haces de todas formas, con su estructura completa de 45 a 55 minutos.", ok: true, f: "Esta reunión no se cancela cuando hay mucho trabajo. Es especialmente necesaria cuando hay mucho trabajo." },
        { t: "La pospones al próximo mes; el equipo lo entenderá.", f: "Cancelar la reunión «porque hay mucho trabajo» es la señal de alerta del Estándar mínimo 1." },
        { t: "La reduces a diez minutos para informar lo indispensable.", f: "Una reunión solo de información, donde el líder habla y el equipo escucha, no cumple el estándar. La voz del equipo tiene 15 minutos propios." }
      ], clave: "Reunión mensual todos los meses, sin cancelar: resultados · momento cultural · voz del equipo · compromisos · información." },
    { id: "entrevista", t: "Estoy entrevistando a una candidata para asesora de crédito", roles: ["lider", "gerencia"], tema: "Género", ref: "Compromiso 1: Reclutamiento con balance de género", herr: "genero",
      caso: "Entrevistas a una candidata para un puesto de asesora de crédito, que implica trabajo de campo.",
      op: [
        { t: "Evalúas con los criterios documentados antes de la entrevista y haces solo preguntas que le harías a un candidato hombre.", ok: true, f: "Los criterios se definen y documentan antes de iniciar entrevistas; eso reduce el sesgo de afinidad." },
        { t: "Le preguntas si tiene hijos y quién los cuida, para saber si podrá salir a campo.", f: "Estado civil, hijos o planes de tenerlos son preguntas que nunca se hacen en una entrevista de ADICLA. Comunican sin palabras que ciertos roles no son para mujeres." }
      ], clave: "Preguntas que nunca se hacen: estado civil, hijos, planes de matrimonio, ni ninguna que no se haría a un hombre." },
    { id: "vacante", t: "Se abre una vacante de asesor regional: ¿cómo la difundo?", roles: ["lider", "gerencia"], tema: "Equidad", ref: "Eje 6: Talento humano y ética",
      caso: "Se abre una vacante de asesor regional. Tienes listo el correo para enviarlo a los jefes de agencia.",
      op: [
        { t: "Lo envías a todos los equipos con una nota: si conocen a alguien con el perfil, que hablen con esa persona y la animen a postular.", ok: true, f: "Antes de enviar, alguien pregunta: ¿cuántas mujeres en sus agencias podrían postular? Esa pregunta cambia el correo y hace la oportunidad pareja." },
        { t: "Lo envías solo a los jefes de agencia; ellos sabrán a quién decirle.", f: "Difundir oportunidades de manera informal, de modo que solo las conozcan quienes ya tienen acceso cercano, erosiona el Eje 6." },
        { t: "Se lo comentas directamente a dos personas que ya tienes en mente.", f: "Las oportunidades internas se difunden activamente a todas las agencias y a todas las personas, con criterios claros y objetivos." }
      ], clave: "Las oportunidades internas llegan a todas las agencias y a todas las personas, con criterios claros." },
    { id: "otro-jefe", t: "Otro jefe de agencia me escribe que su equipo tuvo una semana muy difícil", roles: ["lider"], tema: "Apoyo al compañero", ref: "Principio 3: Apoyo al compañero",
      caso: "Lunes por la mañana. Recibes un mensaje de otro jefe de agencia: tuvieron una semana muy difícil y el equipo está bajo.",
      op: [
        { t: "Lo llamas y lo escuchas sin interrumpir. Después le propones destacar en la próxima reunión cómo su equipo mantuvo el servicio.", ok: true, f: "En el manual la llamada dura 12 minutos. No lo hizo porque se lo pidieron; lo hizo porque eso es lo que hace ADICLA." },
        { t: "Le respondes con un emoji de ánimo y sigues con tu día.", f: "El manual contrasta explícitamente la llamada con «responder con un emoji de ánimo». En ADICLA no se trabaja en silos." },
        { t: "No respondes: esa agencia no es tu problema.", f: "«Esa agencia no es mi problema» es la frase que el Principio 3 marca como lo que nunca hacemos." }
      ], clave: "Lo que le pasa a otra agencia o a otra área nos concierne a todos." },
    { id: "cambio-procedimiento", t: "Recibo por correo un cambio de procedimiento para reenviar a las agencias", roles: ["gerencia"], tema: "Gobernanza", ref: "Eje 1: Gobernanza y liderazgo",
      caso: "9 de la mañana. Como supervisor regional recibes por correo un cambio de procedimiento que afecta a todas las agencias.",
      op: [
        { t: "Lo lees dos veces, anotas tus preguntas, llamas para aclararlas y al día siguiente convocas a los líderes para explicar el cambio y el razonamiento detrás.", ok: true, f: "Esa tarde, cada líder de área hace lo mismo con su equipo. Las decisiones llegan con contexto y razón, no por reenvío." },
        { t: "Lo reenvías al grupo de jefes tal como llegó.", f: "Que el equipo se entere de novedades institucionales sin consulta ni explicación es una de las conductas que erosionan el Eje 1." }
      ], clave: "El líder explica el contexto y la razón de las decisiones que afectan al equipo, dentro de las 24 horas." },
    { id: "auditoria-hallazgo", t: "Auditoría detecta que varias agencias omiten el mismo paso", roles: ["gerencia"], tema: "Error y aprendizaje", ref: "Eje 3: Auditoría",
      caso: "La auditoría interna detecta que en varias agencias se omite sistemáticamente un paso del proceso de desembolso.",
      op: [
        { t: "Convocas a los jefes de agencia a una reunión de análisis: la pregunta no es por qué lo hicieron mal, sino por qué el proceso lo permite.", ok: true, f: "En el manual descubren que el paso es redundante con uno posterior y lo ajustan en toda ADICLA esa semana. Un error detectado se traduce en mejora, no solo en sanción." },
        { t: "Envías un correo de llamada de atención a las agencias involucradas.", f: "Usar los resultados de auditoría para señalar sin análisis de contexto crea un ambiente donde el equipo prefiere ocultar errores." }
      ], clave: "Un error detectado debe traducirse en mejora, no solo en sanción." },
    { id: "colaborador-se-va", t: "Un colaborador presentó su renuncia", roles: ["lider", "gerencia"], tema: "Ciclo del colaborador", ref: "Momento 4: Cuando alguien se va de ADICLA", herr: "ciclo",
      caso: "Un asesor con tres años en la agencia presenta su renuncia.",
      op: [
        { t: "Haces una entrevista de salida para entender la razón real y le agradeces su contribución con sinceridad.", ok: true, f: "La cultura no termina cuando alguien se va: termina cuando siente que lo que vivió aquí lo hizo mejor." },
        { t: "Procesas la salida como un trámite más de Talento Humano.", f: "Tratar la salida como un trámite administrativo e ignorar los motivos, como si no tuvieran nada que enseñarnos, es lo que el manual marca como lo que no se hace." }
      ], clave: "Entrevista de salida para aprender; comunicación con dignidad; agradecimiento sincero." },
    { id: "reporte-miercoles", t: "Me comprometí a entregar un reporte el miércoles y no voy a llegar", roles: ["lider"], tema: "Ejemplo", ref: "Atributo 1: Lidera con el ejemplo",
      caso: "Te comprometiste a entregar un reporte el miércoles. El martes en la tarde un problema imprevisto te impide terminarlo.",
      op: [
        { t: "Llamas a coordinación el martes mismo para avisar.", ok: true, f: "No esperas al miércoles para informar que no lo pudiste hacer. Lo que el líder exige al equipo, lo practica él primero." },
        { t: "Lo entregas el jueves y explicas que no fue tu culpa.", f: "Minimizar los propios errores con excusas mientras se exige responsabilidad al equipo es lo que el Atributo 1 marca como lo que el líder nunca hace." }
      ], clave: "Cuando comete un error, lo dice: «me equivoqué en esto, lo voy a corregir así»." },
    { id: "nuevo-servicios-generales", t: "Llegó un compañero nuevo de servicios generales, tímido y sin experiencia", roles: ["ventanilla", "asesor", "gerencia"], tema: "Trato digno", ref: "Principio 1: Trato digno a toda persona",
      caso: "Ingresa un nuevo compañero de servicios generales, tímido y sin experiencia en oficina.",
      op: [
        { t: "Lo recibes, lo presentas al equipo y te tomas el tiempo de explicarle cómo funciona todo.", ok: true, f: "El compañero se siente parte desde el primer día. El trato digno no depende del cargo: se da entre todos, en cualquier área." },
        { t: "Dejas que se ubique solo; no es de tu área y ya le explicarán.", f: "Tratar con más atención a quien tiene mayor cargo, y dejar perdido a quien no lo tiene, es lo contrario del Principio 1." }
      ], clave: "Toda persona que interactúa con ADICLA merece trato respetuoso e inclusivo. Sin excepción." },
    { id: "cierre-atencion", t: "El socio ya firmó y se levanta para irse", roles: ["ventanilla", "asesor"], tema: "Servicio", ref: "Los cinco momentos del servicio", herr: "momentos",
      caso: "Terminaste el trámite. El socio firmó y se levanta para irse.",
      op: [
        { t: "Antes de que se vaya, confirmas qué recibió hoy, qué sigue, cuándo y con quién.", ok: true, f: "El socio nunca sale sin saber el próximo paso. Cierro toda atención confirmando el próximo paso y el plazo concreto." },
        { t: "Lo despides con cortesía; si tiene dudas, ya preguntará.", f: "Dejar al socio sin una respuesta clara sobre qué sigue, asumiendo que entendió todo porque no preguntó, es lo que el estándar de servicio marca como lo que nunca hacemos." }
      ], clave: "Qué recibió hoy · Qué sigue · Cuándo · Con quién" },
    { id: "socio-situacion-dificil", t: "Noto que un socio pasa por una situación difícil más allá del crédito", roles: ["asesor", "ventanilla"], tema: "Compromiso social", ref: "Valor: Compromiso social · Personalidad: Humana",
      caso: "En una visita, un socio deja ver que está pasando por una situación difícil que va más allá del crédito.",
      op: [
        { t: "Actúas con calidez: lo orientas sobre las opciones disponibles o lo canalizas con quien pueda ayudarlo, y das seguimiento.", ok: true, f: "Cualquier colaborador que, desde su rol, detecta que un socio está pasando una situación difícil actúa y da seguimiento. Antes del expediente está la persona." },
        { t: "Cierras tu trámite y te vas; lo demás no es asunto del crédito.", f: "«El asesor cierra su trámite y se va sin preguntarle cómo está la familia» es la conducta que el valor Compromiso social marca como lo que no hace." }
      ], clave: "Antes del número de crédito está el socio con nombre, historia y proyecto de vida." }
  ]
};

</script>
<script>
(function(){
"use strict";
const $app = document.getElementById("app");
const S = DATA.situaciones, H = DATA.herramientas, R = DATA.roles;
const colores = ["var(--rel-verde)","var(--rel-azul)","var(--rel-celeste)","var(--rel-verde)","var(--rel-azul)","var(--rel-celeste)"];
const esc = s => String(s==null?"":s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const rolN = id => (R.find(r=>r.id===id)||{}).corto||id;
const herrById = id => H.find(h=>h.id===id);
const sitById = id => S.find(s=>s.id===id);

/* ---------- Avance guardado en este navegador ---------- */
const KEY = "adicla.cultura.avance.v1", KEY2 = "adicla.cultura.estandares.v1";
function cargar(k){ try{ return JSON.parse(localStorage.getItem(k)||"{}")||{}; }catch(e){ return {}; } }
function guardar(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
let avance = cargar(KEY), estandares = cargar(KEY2);
const resuelta = id => !!(avance[id] && avance[id].ok);
const totalOk = () => S.filter(s=>resuelta(s.id)).length;

/* ---------- Estado ---------- */
let filtroRol = "todos", q = "";
let cronoT = null;

/* ---------- Utilidades ---------- */
const ico = {
  ok:'<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12 5 5 9-10"/></svg>',
  no:'<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>',
  flecha:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>',
  atras:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M11 6l-6 6 6 6"/></svg>',
  rayo:'<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"><path d="M13 2 4 14h7l-1 8 9-12h-7z"/></svg>',
  libro:'<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h12l4 4v12H4z"/><path d="M8 12h8M8 16h5"/></svg>',
  persona:'<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>',
  clave:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2v4M12 18v4M2 12h4M18 12h4"/><circle cx="12" cy="12" r="5"/></svg>'
};
function semanaISO(d){ const t=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())); const day=t.getUTCDay()||7; t.setUTCDate(t.getUTCDate()+4-day); const y0=new Date(Date.UTC(t.getUTCFullYear(),0,1)); return [t.getUTCFullYear(), Math.ceil((((t-y0)/864e5)+1)/7)]; }
function sitSemana(){ const [y,w]=semanaISO(new Date()); return S[(y*53+w*7)%S.length]; }
function mezclar(a){ const b=a.slice(); for(let i=b.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [b[i],b[j]]=[b[j],b[i]]; } return b; }
function toast(msg){ const t=document.createElement("div"); t.className="toast"; t.textContent=msg; document.body.appendChild(t); setTimeout(()=>t.remove(),1800); }
function pararCrono(){ if(cronoT){ clearInterval(cronoT); cronoT=null; } }

/* ---------- Render de piezas ---------- */
function tarjetaSit(s){
  const ok = resuelta(s.id);
  return `<a class="sit ${ok?"ok":""}" href="#s-${s.id}">
    <span class="marca" aria-hidden="true">${ok?ico.ok:""}</span>
    <span><span class="t">${esc(s.t)}</span><span class="m"><b>${esc(s.tema)}</b> · ${s.roles.map(rolN).map(esc).join(", ")}</span></span></a>`;
}
function listaSits(arr){ return arr.length ? `<div class="sits">${arr.map(tarjetaSit).join("")}</div>` : `<p class="vacio">No hay situaciones con ese filtro.</p>`; }
function tarjetaHerr(h){
  return `<a class="herr" href="#h-${h.id}"><span><span class="g">${esc(h.grupo)}</span><br><span class="t">${esc(h.n)}</span></span>${ico.flecha}</a>`;
}
function barraAvance(){
  const n=totalOk(), t=S.length, p=Math.round(100*n/t);
  return `<div class="card" id="avance-card"><div class="fila" style="justify-content:space-between"><div><div class="eyebrow">Mi avance en este dispositivo</div><div class="kpi">${n} <span style="font-size:1rem;color:var(--tinta2);font-weight:600">de ${t} situaciones</span></div></div><a class="btn lin" href="#avance">Ver detalle ${ico.flecha}</a></div><div class="progreso" style="margin-top:8px" role="progressbar" aria-valuenow="${p}" aria-valuemin="0" aria-valuemax="100"><i style="width:${p}%"></i></div><div class="mini-roles">${R.map(r=>{ const a=S.filter(s=>s.roles.includes(r.id)); const k=a.filter(s=>resuelta(s.id)).length; return `<a href="#rol-${r.id}"><span>${esc(r.corto)}</span><b>${k}/${a.length}</b></a>`; }).join("")}</div></div>`;
}
function brujula(){
  return `<div class="card"><div class="eyebrow">Brújula ADICLA</div><h2>Seis letras para decidir</h2><p class="sub" style="margin-bottom:12px">${esc(DATA.brujulaNota)}</p>
  <div class="brujula" id="brujula">${DATA.brujula.map((b,i)=>`<button class="letra" style="--c:${colores[i]}" data-i="${i}" aria-expanded="false"><b>${b.l}</b><span>${esc(b.w)}</span></button>`).join("")}</div>
  <div id="brujula-det" style="margin-top:12px" hidden></div></div>`;
}

/* ---------- Vistas ---------- */
function vInicio(){
  const s = sitSemana();
  return `<div class="vista pila-g">
    <div class="hero"><div class="eyebrow">Manual de Cultura Organizacional · ADICLA</div><h1>¿Qué necesitas ahora?</h1><p class="sub">Esta guía resume el manual en lo que se usa en el día a día: qué hacer ante una situación, qué protocolo seguir y qué espera ADICLA de cada rol. No hace falta leer todo el manual.</p></div>
    <div class="puertas">
      <a class="puerta" href="#situaciones" style="--c:var(--rel-azul)"><span class="ic">${ico.rayo}</span><h2>Tengo una situación</h2><p>Un socio molesto, un error en el expediente, un conflicto en el equipo. Decide y mira qué haría ADICLA.</p><span class="n">${S.length} situaciones de decisión</span></a>
      <a class="puerta" href="#consulta" style="--c:var(--rel-celeste)"><span class="ic">${ico.libro}</span><h2>Consulta rápida</h2><p>Protocolos paso a paso, qué canal usar, la reunión mensual con cronómetro, el calendario cultural.</p><span class="n">${H.length} herramientas</span></a>
      <a class="puerta" href="#roles" style="--c:var(--rel-verde)"><span class="ic">${ico.persona}</span><h2>Mi rol</h2><p>Lo que el manual espera de líderes, asesores, ventanilla y gerencia, con sus situaciones y herramientas.</p><span class="n">${R.length} rutas</span></a>
    </div>
    <div class="grid2">

  const porRol = R.map(r=>{ const a=S.filter(s=>s.roles.includes(r.id)); return {r, t:a.length, ok:a.filter(s=>resuelta(s.id)).length}; });

function vBuscar(){
  const t = q.trim().toLowerCase();
  if(t.length<2) return vInicio();
  const hit = (...xs) => xs.some(x => String(x||"").toLowerCase().includes(t));
  const sits = S.filter(s=>hit(s.t,s.caso,s.tema,s.ref,s.clave,...s.op.map(o=>o.t+" "+o.f)));
  const herrs = H.filter(h=>hit(h.n,h.lead,h.grupo,JSON.stringify(h)));
  const ident = [];
  DATA.valores.forEach(v=>{ if(hit(v.n,v.lema,v.ejemplo,JSON.stringify(v.tabla))) ident.push({t:"Valor: "+v.n, d:v.lema}); });
  DATA.principios.forEach((p,i)=>{ if(hit(p.n,p.lema,p.hacemos.join(" "),p.nunca.join(" "))) ident.push({t:"Principio "+(i+1)+": "+p.n, d:p.lema}); });
  DATA.atributosLider.forEach((a,i)=>{ if(hit(a.n,a.lema,a.hace.join(" "),a.nunca.join(" "),a.ejemplo)) ident.push({t:"Atributo del líder "+(i+1)+": "+a.n, d:a.lema}); });
  DATA.ejes.forEach((e,i)=>{ if(hit(e.n,e.reto,e.vivo.join(" "),e.erosiona.join(" "),e.ejemplo)) ident.push({t:"Eje "+(i+1)+": "+e.n, d:e.reto}); });
  DATA.brujula.forEach(b=>{ if(hit(b.w,b.t)) ident.push({t:"Brújula: "+b.l+" de "+b.w, d:b.t}); });
  DATA.personalidad.forEach(p=>{ if(hit(p.a,p.s,p.p)) ident.push({t:"Personalidad: "+p.a, d:p.s}); });
  const nada = !sits.length && !herrs.length && !ident.length;
  return `<div class="vista pila-g">
    <div><div class="eyebrow">Búsqueda</div><h1>Resultados para «${esc(q.trim())}»</h1></div>
    ${nada?`<p class="vacio">Nada con esas palabras. Prueba con otra: queja, error, idioma, reunión, mujer, WhatsApp, socio.</p>`:""}
    ${sits.length?`<section class="res"><h2>Situaciones (${sits.length})</h2>${listaSits(sits)}</section>`:""}
    ${herrs.length?`<section class="res"><h2>Herramientas (${herrs.length})</h2><div class="herrs">${herrs.map(tarjetaHerr).join("")}</div></section>`:""}
    ${ident.length?`<section class="res"><h2>Identidad (${ident.length})</h2><div class="pila">${ident.map(i=>`<a class="card plana" href="#identidad" style="text-decoration:none;color:inherit"><h3 style="color:var(--azul)">${esc(i.t)}</h3><p>${esc(i.d)}</p></a>`).join("")}</div></section>`:""}
  </div>`;
}

function vNo(){ return `<div class="vista"><p class="vacio">Esa página no existe. <a href="#inicio">Volver al inicio</a></p></div>`; }

/* ---------- Enrutador ---------- */
function ruta(){
  const h = (location.hash||"#inicio").slice(1);
  if(h==="buscar") return {v:"buscar"};
  if(h.startsWith("s-")) return {v:"situacion", id:h.slice(2)};
  if(h.startsWith("rol-")) return {v:"rol", id:h.slice(4)};
  if(h.startsWith("h-")) return {v:"herr", id:h.slice(2)};
  return {v:h};
}
function render(){
  pararCrono();
  const r = ruta();
  let html, tab = r.v;
  switch(r.v){
    case "inicio": html=vInicio(); break;
    case "situaciones": html=vSituaciones(); break;
    case "situacion": html=vSituacion(r.id); tab="situaciones"; break;
    case "roles": html=vRoles(); break;
    case "rol": html=vRol(r.id); tab="roles"; break;
    case "consulta": html=vConsulta(); break;
    case "herr": html=vHerr(r.id); tab="consulta"; break;
    case "identidad": html=vIdentidad(); break;
    case "avance": html=vAvance(); tab="inicio"; break;
    case "buscar": html=vBuscar(); tab="inicio"; break;
    default: html=vNo(); tab="";
  }
  $app.innerHTML = html;
  document.querySelectorAll("[data-v]").forEach(a=>a.classList.toggle("act", a.dataset.v===tab));
  window.scrollTo({top:0, behavior:"instant"});
  if(r.v!=="buscar"){ const qi=document.getElementById("q"); if(qi && document.activeElement!==qi) qi.value=""; q=""; }
}

/* ---------- Interacciones ---------- */
document.getElementById("q").addEventListener("input", e=>{
  q = e.target.value;
  if(q.trim().length>=2){ if(location.hash!=="#buscar") history.replaceState(null,"","#buscar"); $app.innerHTML = vBuscar(); document.querySelectorAll("[data-v]").forEach(a=>a.classList.remove("act")); }
  else if(location.hash==="#buscar"){ history.replaceState(null,"","#inicio"); render(); }
});
document.getElementById("q").addEventListener("keydown", e=>{ if(e.key==="Escape"){ e.target.value=""; q=""; location.hash="#inicio"; } });

$app.addEventListener("click", e=>{
  const t = e.target.closest("button, a"); if(!t) return;
  /* filtros de rol */
  if(t.dataset.rol){ filtroRol=t.dataset.rol; render(); return; }
  /* situación al azar */
  if(t.id==="btnAzar"){ const pend=S.filter(s=>!resuelta(s.id)); const arr=pend.length?pend:S; location.hash="#s-"+arr[Math.floor(Math.random()*arr.length)].id; return; }
  /* brújula */
  if(t.classList.contains("letra")){ const i=+t.dataset.i, det=document.getElementById("brujula-det"); const b=DATA.brujula[i]; const abierto=det.dataset.i===String(i)&&!det.hidden; document.querySelectorAll(".letra").forEach(x=>x.setAttribute("aria-expanded","false")); if(abierto){ det.hidden=true; det.dataset.i=""; return; } det.dataset.i=i; det.hidden=false; t.setAttribute("aria-expanded","true"); det.innerHTML=`<div class="brujula-det" style="--c:${colores[i]}"><b>${b.l} · ${esc(b.w)}</b><p style="margin-top:4px">${esc(b.t)}</p></div>`; return; }
  /* opción de decisión */
  if(t.classList.contains("opcion")){ decidir(t); return; }
  /* guía de canales */
  if(t.classList.contains("gc")){ const o=t.classList.toggle("open"); t.setAttribute("aria-expanded", o?"true":"false"); return; }
  /* checklist */
  if(t.parentElement && t.parentElement.classList.contains("sel")){ const i=t.parentElement.dataset.i, v=t.dataset.v; estandares[i] = estandares[i]===v ? "" : v; guardar(KEY2, estandares); t.parentElement.querySelectorAll("button").forEach(b=>{ b.className = (estandares[i]===b.dataset.v) ? b.dataset.v : ""; }); return; }
  /* cronómetro */
  if(t.id==="cIni"||t.id==="cSig"||t.id==="cRe"){ crono(t.id); return; }
  /* borrar avance */
  if(t.id==="btnBorrar"){ const box=document.getElementById("borrar"); box.innerHTML=`<h3 style="margin-bottom:6px">¿Seguro que quieres borrar tu avance?</h3><div class="fila"><button class="btn rojo" id="btnBorrarSi">Sí, borrar</button><button class="btn sec" id="btnBorrarNo">Cancelar</button></div>`; return; }
  if(t.id==="btnBorrarSi"){ avance={}; guardar(KEY, avance); toast("Avance borrado"); render(); return; }
  if(t.id==="btnBorrarNo"){ render(); return; }
});

function decidir(btn){
  const cont = btn.closest("[data-sit]"); const s = sitById(cont.dataset.sit); const i=+btn.dataset.i; const o=s.op[i];
  const ver = document.getElementById("veredicto");
  const intentos = +(cont.dataset.intentos||0)+1; cont.dataset.intentos = intentos;
  if(o.ok){
    btn.classList.add("ok"); btn.querySelector(".l").innerHTML = ico.ok;
    cont.querySelectorAll(".opcion").forEach(b=>{ b.disabled=true; });
    ver.innerHTML = `<div class="veredicto ok"><h3>${ico.ok} Así actúa ADICLA</h3><p>${esc(o.f)}</p></div>`;
    const ya = resuelta(s.id);
    if(!ya){ avance[s.id]={ok:true, primera:intentos===1, t:Date.now()}; guardar(KEY, avance); }
    const cierre = document.getElementById("cierre"); cierre.hidden=false;
    /* siguiente: pendiente del mismo rol si existe */
    const idx = S.indexOf(s); const orden = S.slice(idx+1).concat(S.slice(0,idx));
    const pend = orden.filter(x=>!resuelta(x.id) && x.roles.some(r=>s.roles.includes(r)));
    const todas = orden.filter(x=>!resuelta(x.id));
    const sig = (pend.length?pend:todas)[0];
    const bs = document.getElementById("btnSig"); if(sig){ bs.href="#s-"+sig.id; } else { bs.textContent="Completaste todas"; bs.href="#avance"; }
    ver.scrollIntoView({behavior:"smooth", block:"nearest"});
  } else {
    btn.classList.add("no"); btn.querySelector(".l").innerHTML = ico.no; btn.disabled=true;
    ver.innerHTML = `<div class="veredicto no"><h3>${ico.no} Así nunca actúa ADICLA</h3><p>${esc(o.f)}</p><p style="font-weight:700;font-family:var(--display)">Vuelve a elegir.</p></div>`;
    ver.scrollIntoView({behavior:"smooth", block:"nearest"});
  }
}

/* Cronómetro de la reunión mensual */
let audioCtx = null;
function beep(){ try{ audioCtx = audioCtx || new (window.AudioContext||window.webkitAudioContext)(); const o=audioCtx.createOscillator(), g=audioCtx.createGain(); o.frequency.value=880; g.gain.value=.08; o.connect(g); g.connect(audioCtx.destination); o.start(); o.stop(audioCtx.currentTime+.35); }catch(e){} }
function crono(cmd){
  const c = document.getElementById("crono"); if(!c) return;
  const h = herrById("reunion"); const M = h.momentos;
  let idx=+c.dataset.idx, rest=+c.dataset.rest, run=c.dataset.run==="1";
  const pinta = ()=>{ const m=Math.floor(rest/60), s=rest%60; document.getElementById("reloj").textContent = m+":"+String(s).padStart(2,"0"); document.getElementById("relojT").textContent = idx<M.length ? M[idx].t : "Reunión terminada"; document.querySelectorAll(".mom").forEach((el,k)=>{ el.classList.toggle("act",k===idx); el.classList.toggle("hecho",k<idx); }); document.getElementById("cIni").textContent = run?"Pausar":(idx>=M.length?"Terminada":"Iniciar"); c.dataset.idx=idx; c.dataset.rest=rest; c.dataset.run=run?"1":"0"; };
  const avanzar = ()=>{ idx++; if(idx>=M.length){ run=false; pararCrono(); rest=0; beep(); } else { rest=M[idx].min*60; beep(); } };
  if(cmd==="cIni"){ if(idx>=M.length) return; run=!run; if(run){ beep(); pararCrono(); cronoT=setInterval(()=>{ rest--; if(rest<=0){ avanzar(); } pinta(); },1000); } else { pararCrono(); } }
  if(cmd==="cSig"){ if(idx<M.length){ avanzar(); if(run && idx<M.length){ pararCrono(); cronoT=setInterval(()=>{ rest--; if(rest<=0){ avanzar(); } pinta(); },1000); } } }
  if(cmd==="cRe"){ pararCrono(); run=false; idx=0; rest=M[0].min*60; }
  pinta();
}

window.addEventListener("hashchange", render);
render();
})();
</script>
