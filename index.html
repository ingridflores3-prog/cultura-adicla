<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!--HEAD_START-->
<title>Cultura ADICLA en acción</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;700;800&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap">
<style>
/* Mostrador de consulta: búsqueda arriba, tres puertas de entrada, fichas de situación que abren una pantalla de decisión; pestañas inferiores en teléfono, pestañas arriba en escritorio. */
:root{
  --papel:#f3f6fa; --superficie:#ffffff; --tinta:#132449; --tinta2:#4d5c7a; --linea:#d8e0ec; --suave:#e9eff7;
  --azul:#0f58a4; --azul-tinta:#0b3f78; --celeste:#01b0e7; --verde:#038d55;
  --ok:#0f8a4b; --okbg:#e4f5ec; --no:#c2412b; --nobg:#fbe9e5; --aviso:#9a6700; --avisobg:#fff4d6;
  --rel-azul:#0f58a4; --rel-celeste:#0a9bd0; --rel-verde:#038d55; --ok-rel:#0f8a4b; --no-rel:#c2412b;
  --sombra:0 1px 2px rgba(19,36,73,.06),0 6px 18px rgba(19,36,73,.07);
  --display:"Outfit",system-ui,-apple-system,"Segoe UI",sans-serif;
  --cuerpo:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
  --radio:14px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --papel:#0c1628; --superficie:#152238; --tinta:#e9eef7; --tinta2:#aab7cd; --linea:#27385a; --suave:#1c2c47;
  --azul:#7db4fb; --azul-tinta:#a9ccff; --celeste:#3fc5f5; --verde:#45c47e;
  --ok:#45c47e; --okbg:#12301f; --no:#f28a76; --nobg:#3a1c17; --aviso:#f2c14e; --avisobg:#3a2d0c;
  --rel-azul:#2b6fc2; --rel-celeste:#0ea5dc; --rel-verde:#119a5f; --ok-rel:#168f52; --no-rel:#d4553f;
  --sombra:0 1px 2px rgba(0,0,0,.3),0 8px 20px rgba(0,0,0,.35); color-scheme:dark } }
:root[data-theme="dark"]{
  --papel:#0c1628; --superficie:#152238; --tinta:#e9eef7; --tinta2:#aab7cd; --linea:#27385a; --suave:#1c2c47;
  --azul:#7db4fb; --azul-tinta:#a9ccff; --celeste:#3fc5f5; --verde:#45c47e;
  --ok:#45c47e; --okbg:#12301f; --no:#f28a76; --nobg:#3a1c17; --aviso:#f2c14e; --avisobg:#3a2d0c;
  --rel-azul:#2b6fc2; --rel-celeste:#0ea5dc; --rel-verde:#119a5f; --ok-rel:#168f52; --no-rel:#d4553f;
  --sombra:0 1px 2px rgba(0,0,0,.3),0 8px 20px rgba(0,0,0,.35); color-scheme:dark }

*{box-sizing:border-box}
html{height:100%}
body{margin:0;background:var(--papel);color:var(--tinta);font-family:var(--cuerpo);font-size:17px;line-height:1.5;-webkit-text-size-adjust:100%}
h1,h2,h3,h4{font-family:var(--display);line-height:1.15;margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:1.7rem;font-weight:800}
h2{font-size:1.3rem;font-weight:700}
h3{font-size:1.08rem;font-weight:700}
p{margin:0}
a{color:var(--azul)}
button{font:inherit;color:inherit}
img{max-width:100%}
[hidden]{display:none!important}
:focus-visible{outline:3px solid var(--celeste);outline-offset:2px}
.sr{position:absolute;left:-9999px}

/* Barra superior */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--superficie);border-bottom:1px solid var(--linea)}
.topbar-in{max-width:1040px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:12px}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none;color:inherit;flex:none}
.logo-chip{background:#fff;border-radius:10px;padding:4px 8px;display:flex;align-items:center;border:1px solid var(--linea)}
.logo-chip img{height:30px;width:auto;display:block}
.logo-txt{font-family:var(--display);font-weight:700;font-size:.95rem;line-height:1.1;color:var(--tinta)}
.logo-txt small{display:block;font-family:var(--cuerpo);font-weight:400;font-size:.72rem;color:var(--tinta2);letter-spacing:.04em;text-transform:uppercase}
.buscar{flex:1;min-width:0;display:flex;align-items:center;background:var(--papel);border:1.5px solid var(--linea);border-radius:999px;padding:6px 12px;gap:8px}
.buscar input{flex:1;min-width:0;border:0;background:transparent;font:inherit;font-size:1rem;color:var(--tinta);outline:none}
.buscar svg{flex:none;color:var(--tinta2)}
.buscar input::placeholder{color:var(--tinta2)}
.nav-top{display:none;gap:4px}
.nav-top a{text-decoration:none;color:var(--tinta2);font-family:var(--display);font-weight:600;padding:8px 12px;border-radius:10px;font-size:.95rem}
.nav-top a.act{color:var(--azul);background:var(--suave)}
@media (min-width:900px){ .nav-top{display:flex} .logo-txt{font-size:1.05rem} }
@media (max-width:599px){ .topbar-in{flex-wrap:wrap;row-gap:8px} .buscar{flex-basis:100%} }

/* Contenido */
main{max-width:1040px;margin:0 auto;padding:18px 16px 96px}
@media (min-width:900px){ main{padding:28px 24px 60px} }
.vista{animation:aparece .22s ease-out}
@keyframes aparece{from{opacity:.4;transform:translateY(4px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){ .vista{animation:none} *{transition:none!important} }
.eyebrow{font-family:var(--display);font-weight:600;font-size:.78rem;letter-spacing:.08em;text-transform:uppercase;color:var(--azul)}
.sub{color:var(--tinta2);max-width:62ch}
.pila{display:flex;flex-direction:column;gap:14px}
.pila-g{display:flex;flex-direction:column;gap:26px}
.fila{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.volver{display:inline-flex;align-items:center;gap:6px;color:var(--tinta2);text-decoration:none;font-size:.95rem;font-weight:700;font-family:var(--display)}
.volver:hover{color:var(--azul)}

/* Puertas de entrada (inicio) */
.hero{display:flex;flex-direction:column;gap:6px;margin-bottom:18px}
.hero h1{font-size:2rem}
@media (min-width:600px){ .hero h1{font-size:2.5rem} }
.puertas{display:grid;gap:12px;grid-template-columns:1fr}
@media (min-width:640px){ .puertas{grid-template-columns:repeat(3,1fr)} }
.puerta{display:flex;flex-direction:column;gap:6px;text-decoration:none;color:inherit;background:var(--superficie);border:1.5px solid var(--linea);border-radius:var(--radio);padding:18px 18px 16px;box-shadow:var(--sombra);position:relative;overflow:hidden;min-height:132px;transition:transform .15s ease,border-color .15s ease}
.puerta:hover{transform:translateY(-2px);border-color:var(--azul)}
.puerta::before{content:"";position:absolute;inset:0 auto 0 0;width:6px;background:var(--c)}
.puerta .ic{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;background:var(--c);color:#fff}
.puerta h2{font-size:1.25rem}
.puerta p{color:var(--tinta2);font-size:.95rem}
.puerta .n{margin-top:auto;font-family:var(--display);font-weight:700;color:var(--azul);font-size:.9rem}

/* Tarjetas genéricas */
.card{background:var(--superficie);border:1px solid var(--linea);border-radius:var(--radio);padding:18px;box-shadow:var(--sombra)}
.card.plana{box-shadow:none}
.card h2{margin-bottom:6px}
.grid2{display:grid;gap:12px;grid-template-columns:1fr}
@media (min-width:720px){ .grid2{grid-template-columns:1fr 1fr} }
.grid3{display:grid;gap:12px;grid-template-columns:1fr}
@media (min-width:720px){ .grid3{grid-template-columns:repeat(3,1fr)} }

/* Semana + avance */
.semana{display:flex;flex-direction:column;gap:10px;border-left:6px solid var(--celeste)}
.semana .t{font-family:var(--display);font-size:1.25rem;font-weight:700}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:12px;padding:12px 18px;font-family:var(--display);font-weight:700;font-size:1rem;cursor:pointer;text-decoration:none;background:var(--rel-azul);color:#fff;transition:filter .15s}
.btn:hover{filter:brightness(1.08)}
.btn.sec{background:var(--suave);color:var(--azul-tinta)}
.btn.lin{background:transparent;color:var(--azul);padding-left:8px;padding-right:8px}
.btn.chica{padding:8px 12px;font-size:.9rem;border-radius:10px}
.btn.rojo{background:var(--nobg);color:var(--no)}
.progreso{height:10px;background:var(--suave);border-radius:999px;overflow:hidden}
.progreso i{display:block;height:100%;background:linear-gradient(90deg,var(--azul),var(--celeste));border-radius:999px;transition:width .4s ease}
.kpi{font-family:var(--display);font-weight:800;font-size:1.6rem;font-variant-numeric:tabular-nums}
.mini-roles{display:grid;grid-template-columns:1fr 1fr;gap:6px 14px;margin-top:12px}
.mini-roles a{display:flex;justify-content:space-between;gap:8px;text-decoration:none;color:var(--tinta2);font-size:.92rem;border-bottom:1px dashed var(--linea);padding:4px 0}
.mini-roles a b{color:var(--tinta);font-family:var(--display);font-variant-numeric:tabular-nums}

/* Brújula */
.brujula{display:grid;gap:8px;grid-template-columns:repeat(6,1fr)}
.letra{display:flex;flex-direction:column;align-items:center;gap:6px;background:none;border:0;padding:0;cursor:pointer}
.letra b{width:100%;aspect-ratio:1;max-width:64px;border-radius:14px;display:grid;place-items:center;font-family:var(--display);font-size:1.6rem;font-weight:800;color:#fff;background:var(--c);box-shadow:var(--sombra)}
.letra span{font-size:.72rem;color:var(--tinta2);text-align:center;line-height:1.2}
@media (max-width:420px){ .letra span{display:none} }
.brujula-det{border-left:6px solid var(--c);padding:14px 16px;background:var(--superficie);border-radius:0 var(--radio) var(--radio) 0;border-top:1px solid var(--linea);border-right:1px solid var(--linea);border-bottom:1px solid var(--linea)}
.brujula-det b{font-family:var(--display);font-size:1.1rem;color:var(--c)}

/* Filtros */
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1.5px solid var(--linea);background:var(--superficie);border-radius:999px;padding:7px 14px;font-family:var(--display);font-weight:600;font-size:.9rem;cursor:pointer;color:var(--tinta2)}
.chip.act{background:var(--rel-azul);border-color:var(--rel-azul);color:#fff}

/* Lista de situaciones */
.sits{display:grid;gap:10px;grid-template-columns:1fr}
@media (min-width:720px){ .sits{grid-template-columns:1fr 1fr} }
.sit{display:flex;gap:12px;align-items:flex-start;text-decoration:none;color:inherit;background:var(--superficie);border:1.5px solid var(--linea);border-radius:var(--radio);padding:14px 16px;transition:border-color .15s,transform .15s}
.sit:hover{border-color:var(--azul);transform:translateY(-1px)}
.sit .marca{flex:none;width:30px;height:30px;border-radius:50%;border:2px solid var(--linea);display:grid;place-items:center;color:var(--ok);margin-top:2px}
.sit.ok .marca{border-color:var(--ok);background:var(--okbg)}
.sit .t{font-family:var(--display);font-weight:700;font-size:1.05rem;line-height:1.25}
.sit .m{font-size:.8rem;color:var(--tinta2);margin-top:4px}
.sit .m b{color:var(--azul);font-weight:700}
.etq{display:inline-block;font-size:.72rem;font-family:var(--display);font-weight:600;letter-spacing:.04em;text-transform:uppercase;padding:2px 8px;border-radius:999px;background:var(--suave);color:var(--tinta2);margin-right:4px}

/* Pantalla de decisión */
.decision{max-width:760px}
.caso{background:var(--superficie);border:1px solid var(--linea);border-left:6px solid var(--azul);border-radius:var(--radio);padding:18px 20px;font-size:1.1rem;line-height:1.55}
.pregunta{font-family:var(--display);font-weight:800;font-size:1.35rem;margin-top:6px}
.opciones{display:flex;flex-direction:column;gap:10px}
.opcion{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;background:var(--superficie);border:2px solid var(--linea);border-radius:var(--radio);padding:14px 16px;cursor:pointer;font-size:1.02rem;line-height:1.45;transition:border-color .15s,background .15s}
.opcion:hover:not(:disabled){border-color:var(--azul)}
.opcion:disabled{cursor:default;opacity:.55}
.opcion .l{flex:none;width:30px;height:30px;border-radius:50%;border:2px solid var(--linea);display:grid;place-items:center;font-family:var(--display);font-weight:700;color:var(--tinta2)}
.opcion.ok{border-color:var(--ok);background:var(--okbg);opacity:1}
.opcion.ok .l{background:var(--ok-rel);border-color:var(--ok-rel);color:#fff}
.opcion.no{border-color:var(--no);background:var(--nobg);opacity:1}
.opcion.no .l{background:var(--no-rel);border-color:var(--no-rel);color:#fff}
.veredicto{border-radius:var(--radio);padding:18px 20px;display:flex;flex-direction:column;gap:8px;animation:aparece .25s ease-out}
.veredicto.ok{background:var(--okbg);border:1.5px solid var(--ok)}
.veredicto.no{background:var(--nobg);border:1.5px solid var(--no)}
.veredicto h3{font-size:1.15rem;display:flex;align-items:center;gap:8px}
.veredicto.ok h3{color:var(--ok)} .veredicto.no h3{color:var(--no)}
.clave{display:flex;gap:12px;align-items:flex-start;background:var(--superficie);border:1px solid var(--linea);border-radius:var(--radio);padding:14px 16px}
.clave .ic{flex:none;width:34px;height:34px;border-radius:10px;background:var(--rel-azul);color:#fff;display:grid;place-items:center}
.clave b{font-family:var(--display)}

/* Pasos / protocolos */
.pasos{display:flex;flex-direction:column;gap:0;counter-reset:paso}
.paso{display:grid;grid-template-columns:40px 1fr;gap:12px;padding:12px 0;border-bottom:1px solid var(--linea)}
.paso:last-child{border-bottom:0}
.paso .num{width:36px;height:36px;border-radius:50%;background:var(--rel-azul);color:#fff;display:grid;place-items:center;font-family:var(--display);font-weight:800}
.paso .t{font-family:var(--display);font-weight:700;font-size:1.05rem}
.paso .h{color:var(--tinta);margin-top:2px}
.paso .n{color:var(--no);font-size:.92rem;margin-top:4px}
.paso .n::before{content:"Nunca: ";font-weight:700}
.nunca{background:var(--nobg);border:1.5px solid var(--no);border-radius:var(--radio);padding:14px 16px}
.nunca h3{color:var(--no);font-size:.9rem;letter-spacing:.08em;text-transform:uppercase;margin-bottom:6px}
.nunca ul{margin:0;padding-left:20px}
.lead{font-size:1.08rem;color:var(--tinta2);max-width:64ch}

/* Pares hacemos / nunca */
.pares{display:flex;flex-direction:column;gap:10px}
.par{display:grid;grid-template-columns:1fr;gap:0;border:1px solid var(--linea);border-radius:var(--radio);overflow:hidden;background:var(--superficie)}
@media (min-width:640px){ .par{grid-template-columns:1fr 1fr} }
.par > div{padding:12px 14px}
.par .h{border-left:5px solid var(--ok)}
.par .n{border-left:5px solid var(--no);background:color-mix(in srgb,var(--nobg) 55%,var(--superficie))}
.par .h::before,.par .n::before{display:block;font-family:var(--display);font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;font-weight:700;margin-bottom:3px}
.par .h::before{content:"En ADICLA lo hacemos";color:var(--ok)}
.par .n::before{content:"Nunca lo hacemos";color:var(--no)}
.par.l .h::before{content:"Un líder ADICLA lo hace"} .par.l .n::before{content:"Un líder ADICLA nunca lo hace"}
.par.e .h::before{content:"Hace vivo este eje"} .par.e .n::before{content:"Lo erosiona"}
.par.a .h::before{content:"Señal de alerta";color:var(--aviso)} .par.a .n::before{content:"Quién actúa y cómo";color:var(--azul)} .par.a .n{border-left-color:var(--azul);background:var(--superficie)} .par.a .h{border-left-color:var(--aviso)}
.par.o .h::before{content:"El orgullo existe"} .par.o .n::before{content:"Se está erosionando"}
.par.x .n{border-left-color:var(--tinta2);background:var(--superficie)} .par.x .n::before{content:"Si el líder exige esto al equipo";color:var(--tinta2)} .par.x .h::before{content:"El líder también lo cumple así"}

/* Canales */
.canal{display:grid;gap:4px;border:1px solid var(--linea);border-radius:var(--radio);padding:14px 16px;background:var(--superficie)}
.canal .c{font-family:var(--display);font-weight:700;font-size:1.1rem;color:var(--azul)}
.canal .k{font-size:.78rem;letter-spacing:.06em;text-transform:uppercase;font-family:var(--display);color:var(--tinta2);margin-top:6px}
.canal .no{color:var(--no)}
.guia-canal{display:flex;flex-direction:column;gap:8px}
.gc{display:flex;flex-direction:column;gap:4px;background:var(--superficie);border:1.5px solid var(--linea);border-radius:12px;padding:12px 14px;text-align:left;cursor:pointer}
.gc b{font-family:var(--display);color:var(--azul)}
.gc .r{display:none;color:var(--tinta);padding-top:6px;border-top:1px dashed var(--linea);margin-top:4px}
.gc.open .r{display:block}

/* Reunión con cronómetro */
.crono{display:flex;flex-direction:column;gap:14px}
.reloj{font-family:var(--display);font-size:3.2rem;font-weight:800;font-variant-numeric:tabular-nums;line-height:1;text-align:center}
.reloj small{display:block;font-size:.9rem;font-weight:600;color:var(--tinta2);letter-spacing:.06em;text-transform:uppercase;margin-top:6px}
.momentos{display:flex;flex-direction:column;gap:8px}
.mom{display:grid;grid-template-columns:52px 1fr;gap:12px;align-items:start;padding:12px 14px;border:1.5px solid var(--linea);border-radius:12px;background:var(--superficie)}
.mom.act{border-color:var(--celeste);box-shadow:0 0 0 3px color-mix(in srgb,var(--celeste) 25%,transparent)}
.mom.hecho{opacity:.6}
.mom .min{font-family:var(--display);font-weight:800;font-size:1.2rem;color:var(--azul);font-variant-numeric:tabular-nums}
.mom .min small{display:block;font-size:.7rem;color:var(--tinta2);font-weight:600}
.mom .t{font-family:var(--display);font-weight:700}
.mom .d{font-size:.95rem;color:var(--tinta2)}

/* Checklist */
.check{display:flex;flex-direction:column;gap:10px}
.ck{border:1.5px solid var(--linea);border-radius:var(--radio);padding:14px 16px;background:var(--superficie);display:flex;flex-direction:column;gap:8px}
.ck .t{font-family:var(--display);font-weight:700;font-size:1.05rem}
.ck .al{font-size:.92rem;color:var(--no)}
.ck .al::before{content:"Señal de alerta: ";font-weight:700}
.ck .sel{display:flex;gap:8px;flex-wrap:wrap}
.ck .sel button{border:1.5px solid var(--linea);background:var(--papel);border-radius:999px;padding:7px 14px;cursor:pointer;font-family:var(--display);font-weight:600;font-size:.9rem;color:var(--tinta2)}
.ck .sel button.ok{background:var(--okbg);border-color:var(--ok);color:var(--ok)}
.ck .sel button.no{background:var(--nobg);border-color:var(--no);color:var(--no)}

/* Acordeón */
details{border:1px solid var(--linea);border-radius:var(--radio);background:var(--superficie)}
details+details{margin-top:10px}
summary{cursor:pointer;padding:14px 16px;font-family:var(--display);font-weight:700;font-size:1.05rem;list-style:none;display:flex;align-items:center;gap:10px}
summary::-webkit-details-marker{display:none}
summary::after{content:"";margin-left:auto;width:10px;height:10px;border-right:2.5px solid var(--azul);border-bottom:2.5px solid var(--azul);transform:rotate(45deg);transition:transform .2s;flex:none}
details[open] summary::after{transform:rotate(-135deg)}
.det-in{padding:0 16px 16px;display:flex;flex-direction:column;gap:12px}
.lema{font-size:1.05rem;font-style:italic;color:var(--tinta2);border-left:4px solid var(--celeste);padding-left:12px}
.ej{background:var(--suave);border-radius:12px;padding:12px 14px;font-size:.98rem}
.ej::before{content:"Ejemplo ADICLA";display:block;font-family:var(--display);font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--azul);font-weight:700;margin-bottom:4px}
.tabla-rol{display:flex;flex-direction:column;gap:8px}
.tr{display:grid;grid-template-columns:1fr;border:1px solid var(--linea);border-radius:12px;overflow:hidden}
@media (min-width:640px){ .tr{grid-template-columns:120px 1fr 1fr} }
.tr > div{padding:10px 12px;font-size:.95rem}
.tr .r{font-family:var(--display);font-weight:700;background:var(--suave)}
.tr .h{border-left:4px solid var(--ok)} .tr .n{border-left:4px solid var(--no)}
.tr .h::before{content:"Lo que hace: ";font-weight:700;color:var(--ok)} .tr .n::before{content:"Lo que no hace: ";font-weight:700;color:var(--no)}

/* Personalidad */
.pers{display:grid;gap:10px;grid-template-columns:1fr}
@media (min-width:720px){ .pers{grid-template-columns:1fr 1fr 1fr} }
.per{background:var(--superficie);border:1px solid var(--linea);border-radius:var(--radio);padding:16px;display:flex;flex-direction:column;gap:6px}
.per h3{color:var(--azul);font-size:1.15rem;text-transform:uppercase;letter-spacing:.04em}
.per .p{font-size:.92rem;color:var(--tinta2);border-top:1px dashed var(--linea);padding-top:8px;margin-top:4px}
.per .p::before{content:"En la práctica: ";font-weight:700;color:var(--tinta)}

/* Rol */
.rol-card{display:flex;gap:14px;align-items:center;text-decoration:none;color:inherit;background:var(--superficie);border:1.5px solid var(--linea);border-radius:var(--radio);padding:16px}
.rol-card:hover{border-color:var(--azul)}
.rol-card .ic{flex:none;width:48px;height:48px;border-radius:12px;background:var(--suave);color:var(--azul);display:grid;place-items:center}
.rol-card h2{font-size:1.15rem}
.rol-card p{color:var(--tinta2);font-size:.92rem}
.plan{display:grid;gap:10px;grid-template-columns:1fr}
@media (min-width:720px){ .plan{grid-template-columns:repeat(3,1fr)} }
.plan .card h3{color:var(--azul);font-size:.8rem;letter-spacing:.08em;text-transform:uppercase;margin-bottom:6px}
.herrs{display:flex;flex-direction:column;gap:8px}
.herr{display:flex;align-items:center;gap:12px;text-decoration:none;color:inherit;background:var(--superficie);border:1.5px solid var(--linea);border-radius:12px;padding:12px 14px}
.herr:hover{border-color:var(--azul)}
.herr .t{font-family:var(--display);font-weight:700}
.herr .g{font-size:.78rem;color:var(--tinta2);text-transform:uppercase;letter-spacing:.06em;font-family:var(--display)}
.herr svg{margin-left:auto;flex:none;color:var(--tinta2)}

/* Indicadores */
.ind{display:flex;flex-direction:column;gap:6px;background:var(--superficie);border:1px solid var(--linea);border-radius:12px;padding:12px 14px}
.ind .n{font-family:var(--display);font-weight:700}
.ind .v{display:flex;gap:16px;font-variant-numeric:tabular-nums;flex-wrap:wrap}
.ind .v span{font-size:.78rem;color:var(--tinta2);text-transform:uppercase;letter-spacing:.06em;font-family:var(--display);display:block}
.ind .v b{font-size:1.15rem;font-family:var(--display)}
.ind .barra{height:8px;background:var(--suave);border-radius:999px;position:relative;overflow:hidden}
.ind .barra i{position:absolute;left:0;top:0;bottom:0;background:var(--azul);border-radius:999px}
.ind .barra em{position:absolute;top:-2px;bottom:-2px;width:3px;background:var(--verde)}
.ind .r{font-size:.85rem;color:var(--tinta2)}

/* Calendario */
.cal{display:grid;gap:10px;grid-template-columns:1fr}
@media (min-width:640px){ .cal{grid-template-columns:1fr 1fr} }
@media (min-width:900px){ .cal{grid-template-columns:repeat(3,1fr)} }
.mes{background:var(--superficie);border:1px solid var(--linea);border-radius:var(--radio);padding:14px 16px;display:flex;flex-direction:column;gap:4px}
.mes .m{font-family:var(--display);font-weight:800;font-size:1.3rem;color:var(--azul)}
.mes .t{font-family:var(--display);font-weight:700}
.mes .r{font-size:.85rem;color:var(--tinta2);margin-top:4px}

/* Búsqueda */
.res h2{margin:0 0 8px;font-size:.8rem;letter-spacing:.08em;text-transform:uppercase;color:var(--tinta2)}
.vacio{color:var(--tinta2);padding:24px 0;text-align:center}

/* Pestañas inferiores */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--superficie);border-top:1px solid var(--linea);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs-in{display:grid;grid-template-columns:repeat(5,1fr);max-width:640px;margin:0 auto}
.tabs a{display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 4px 8px;text-decoration:none;color:var(--tinta2);font-family:var(--display);font-weight:600;font-size:.68rem;letter-spacing:.02em}
.tabs a.act{color:var(--azul)}
.tabs svg{width:24px;height:24px}
@media (min-width:900px){ .tabs{display:none} }

.pie{margin-top:34px;padding-top:16px;border-top:1px solid var(--linea);font-size:.85rem;color:var(--tinta2)}
.aviso-box{background:var(--avisobg);border:1.5px solid var(--aviso);border-radius:var(--radio);padding:12px 14px;color:var(--tinta)}
.lista-limpia{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:var(--tinta);color:var(--papel);padding:10px 16px;border-radius:999px;font-family:var(--display);font-weight:600;z-index:30;box-shadow:var(--sombra)}
@media (min-width:900px){ .toast{bottom:24px} }
</style>
<!--HEAD_END-->
</head>

  mision: "Somos la asociación de desarrollo, que trabaja para que nuestros socios tengan mejores condiciones de vida, por medio de servicios financieros accesibles otorgados con criterio de impacto social y ambiental.",
  misionNota: "La misión no es un texto para memorizar. Es una brújula: cada decisión se mide en si sirve o no a la familia que confió en nosotros.",
  vision: "Ser referentes en las microfinanzas, por medio de la inclusión financiera, basados en la solidez, confiabilidad y compromiso.",
  visionNota: "Ser referente no significa ser la más grande. Significa que cuando alguien piense en cultura sólida, liderazgo íntegro y servicio real, piense en ADICLA.",

  socio: [
    "Es la persona más importante en nuestra asociación.",
    "No depende de nosotros; nosotros dependemos de él.",
    "No es la interrupción en nuestro trabajo: es la razón de nuestro trabajo.",
    "Nos hace un favor cuando llega; no le estamos haciendo un favor al atenderlo bien.",
    "No es solo dinero en la caja: es un ser humano con sentimientos y merece un trato respetuoso.",
    "Es parte de nuestra asociación, no es ningún extraño.",
    "Merece la atención más cortés que podamos darle; es el alma de la asociación.",
    "Sin él, tendríamos que cerrar las puertas."
  ],

  propuesta: [
    { t: "Somos socios", d: "Relaciones de confianza y acompañamiento", p: "El asesor conoce el nombre del socio y su negocio, le asesora y le hace seguimiento cuando algo sale diferente a lo planificado. No desaparece después del desembolso." },
    { t: "Prestamos al Chilazo", d: "Soluciones ágiles y accesibles", p: "Cuando un socio llega con una necesidad urgente, el equipo busca la manera de responder rápido sin saltarse ningún requisito de calidad o integridad." },
    { t: "Servicio personal", d: "Atención humana, cercana, orientada al bienestar", p: "La atención comienza con el nombre del socio, no con el número de expediente. El socio siente que es una persona, no un trámite." },
    { t: "Tecnología amigable", d: "Herramientas eficientes al servicio de las personas", p: "Cuando se introduce un nuevo sistema, el equipo lo aprende como herramienta para servir mejor, no como carga adicional." }
  ],

  personalidad: [
    { a: "Cercana", s: "No somos una institución distante. Conocemos el nombre del socio, sabemos de su negocio, preguntamos cómo está la familia. La cercanía es profesional y genuina.", p: "Un asesor que atiende a un socio con dos años en ADICLA le pregunta por el nuevo punto de venta que abrió. No porque lo tenga anotado: porque lo recuerda." },
    { a: "Directa", s: "«Préstamos al Chilazo» es nuestra forma de ser: ágiles, accesibles y claros. Sin rodeos ni términos técnicos para confundir.", p: "Cuando un socio pregunta por las condiciones, el asesor explica en lenguaje simple: cuánto paga, cuándo y qué pasa si tiene dificultades. Sin letra pequeña escondida." },
    { a: "Íntegra", s: "Hacemos lo correcto aunque nadie esté mirando. El expediente se llena completo en campo, con o sin supervisión. La integridad es para el trabajo de todos los días.", p: "Son las 4 de la tarde y el asesor está solo en una comunidad. El formulario tiene un campo que casi nadie llena. Él lo llena." },
    { a: "Comunitaria", s: "Somos de los territorios que servimos. Entendemos la cosecha, el mercado, el idioma y el ciclo de vida de las comunidades de la Cuenca. No llegamos a operar: llegamos a acompañar.", p: "Un jefe de agencia sabe cuándo es temporada alta en cada comunidad. Programa las visitas de renovación antes, no después." },
    { a: "Exigente consigo misma", s: "Nos medimos, aprendemos y mejoramos. Cuando algo sale mal, la primera pregunta es qué ocurrió y qué cambiamos, no quién tiene la culpa.", p: "Después de una queja, el equipo no busca culpables. Revisa en qué parte del proceso falló la atención y ajusta el protocolo." },
    { a: "Humana", s: "Antes del expediente está la persona. Antes del número de crédito está el socio con nombre, historia y proyecto de vida.", p: "Un asesor que visita a doña Juana no empieza por el estado de su crédito. Pregunta cómo está ella y el negocio. Después viene el trámite." }
  ],

  brujula: [
    { l: "A", w: "Acompañar", t: "Estamos con el socio antes, durante y después del crédito. No desaparecemos después del desembolso. Acompañar es nuestra promesa más concreta." },
    { l: "D", w: "Dignificar", t: "Toda persona que interactúa con ADICLA merece trato respetuoso, sin importar su idioma, el monto de su crédito o la comunidad de donde viene. La dignidad no es opcional." },
    { l: "I", w: "Integrar", t: "Inclusión, equidad y respeto a la diversidad cultural son parte de cómo operamos. Integramos a las comunidades, a las mujeres, a las personas que hablan otros idiomas." },
    { l: "C", w: "Comprometer", t: "Nuestro trabajo tiene impacto real en familias reales. El compromiso social es el criterio que guía cada decisión, desde la aprobación de un crédito hasta la atención en ventanilla." },
    { l: "L", w: "Liderar con el ejemplo", t: "Lideramos con lo que hacemos, no con lo que pedimos. El líder de ADICLA llega primero, cumple lo que prometió y reconoce su error cuando se equivoca." },
    { l: "A", w: "Aprender siempre", t: "Cuando algo sale mal, preguntamos qué ocurrió antes de buscar culpables. Cada error bien gestionado es información que mejora a la institución." }
  ],
  brujulaNota: "Ante una situación difícil, pregúntate: ¿qué haría ADICLA aquí? La respuesta siempre tiene algo de estas seis letras.",

  valores: [
    { id: "honestidad", n: "Honestidad", lema: "Comunicamos con honestidad, oportunidad y completitud. No omitimos lo incómodo. No adornamos lo que falla.",
      tabla: [
        { r: "El líder", h: "Cuando llega una decisión que al equipo no le va a gustar, la comparte ese mismo día, explica la razón y abre espacio para preguntas. No espera al rumor.", n: "Da la información a medias porque completa «puede generar problemas»." },
        { r: "El colaborador", h: "Cuando comete un error en un expediente, lo reporta de inmediato. No espera a que auditoría lo encuentre ni busca cómo ocultarlo.", n: "Entrega al socio solo la información que le conviene para cerrar el crédito." },
        { r: "Con el socio", h: "Antes de la firma, explica tasa, plazo, cuota y consecuencia de mora en tz'utujil o en español, según lo que el socio maneje mejor. Verifica comprensión.", n: "Avanza la firma porque «ya lo explicamos antes» aunque el socio tenga dudas." }
      ],
      ejemplo: "Son las 4 de la tarde. El asesor nota que la cuota que le explicó a don Mateo la semana pasada tiene un error de cálculo. La firma es mañana. Lo llama esa tarde, le explica y le da la cifra correcta. Don Mateo llega a la firma de todas formas: «gracias por avisarme». ADICLA no ganó nada con esa llamada, pero tampoco perdió lo único que importa: la confianza." },
    { id: "responsabilidad", n: "Responsabilidad", lema: "Asumimos las consecuencias de nuestras decisiones. Cuando algo sale mal, no buscamos culpables: buscamos soluciones y aprendemos.",
      tabla: [
        { r: "El líder", h: "Cuando la agencia comete un error operativo, asume la responsabilidad ante la Gerencia, comunica al equipo lo que pasó y lidera la corrección sin culpar a nadie públicamente.", n: "Transfiere la culpa al equipo cuando hay una falla y toma el crédito cuando hay un logro." },
        { r: "El colaborador", h: "Cuando detecta un error en un expediente que él mismo procesó, lo reporta de inmediato y propone cómo corregirlo.", n: "Espera a que auditoría o el jefe encuentren el error para ver si pasa desapercibido." },
        { r: "Con el socio", h: "Si ADICLA comete un error en la gestión de su crédito, el asesor lo llama, se lo explica y le dice qué se va a hacer y en qué plazo.", n: "El error se corrige en silencio sin informar al socio ni reconocer lo que pasó." }
      ],
      ejemplo: "Jueves por la tarde. El líder de área encuentra que en tres expedientes se saltó la verificación de garantías. La revisión es en dos semanas y nadie lo ha notado. Documenta los casos, llama al supervisor regional esa misma tarde y presenta una propuesta de corrección. No busca a quién culpar." },
    { id: "compromiso", n: "Compromiso social", lema: "Trabajamos para que cada préstamo sea una oportunidad real de mejora de vida. El impacto en las familias es el criterio que guía nuestra actuación.",
      tabla: [
        { r: "El líder", h: "Orienta a su equipo a comprender el contexto de vida del socio, no solo su perfil financiero. Antes de cerrar un crédito pregunta si la solución es la adecuada para esa familia.", n: "El crédito se aprueba o rechaza únicamente por criterios numéricos, sin considerar el impacto real en la persona." },
        { r: "El colaborador", h: "Quien detecta que un socio pasa por una situación difícil actúa con calidez: lo orienta, lo canaliza con quien pueda ayudarlo y da seguimiento. Lo mismo la asistente de contabilidad que agiliza un desembolso o Talento Humano que cuida al personal.", n: "El asesor cierra su trámite y se va sin preguntarle cómo está la familia." },
        { r: "Con el socio", h: "Ante una necesidad urgente, el equipo busca la solución financiera que se ajusta a su capacidad, no la que cierra la operación más rápido.", n: "Se le ofrece el producto de mayor monto aunque no corresponda a su realidad y capacidad de pago." }
      ],
      ejemplo: "Don Marcos quiere Q15,000 para ampliar su taller. En la conversación menciona que su comprador principal se mudó y las ventas no se recuperan. El asesor escucha, pregunta y le propone Q8,000 con un plazo más cómodo. Seis meses después don Marcos paga puntual y sin apuros. El crédito fue menos; el acompañamiento fue más." },
    { id: "solidez", n: "Solidez", lema: "Operamos con solvencia, orden y rigor. La confianza del socio se sostiene con procesos correctos, sin excepciones ni atajos.",
      tabla: [
        { r: "El líder", h: "Revisa que los expedientes cumplan todos los requisitos antes de avanzar. Prefiere retrasar una operación a permitir que pase incompleta.", n: "Aprueba atajos en el proceso cuando hay presión de tiempo o de resultados." },
        { r: "El colaborador", h: "Completa cada paso del protocolo de verificación con el mismo rigor en todas las comunidades, aunque ese día tenga más visitas de lo habitual.", n: "En los días de mayor carga omite pasos porque considera que no son indispensables." },
        { r: "Con el socio", h: "Cuando el socio pregunta por el estado de su crédito, le da información exacta, documentada y consistente con el sistema.", n: "Da información de memoria o aproximada para no tardar en responder." }
      ],
      ejemplo: "Último viernes del mes. Faltan dos operaciones para la meta. Un expediente llega sin una hoja de la escritura. El jefe lo devuelve: «esto lo procesamos la semana que viene, completo». El miércoles llega la hoja, la operación sale sin observaciones y la cartera queda limpia. La agencia no llegó al número ese mes. Pero hizo las cosas bien." },
    { id: "equidad", n: "Equidad", lema: "El mismo trato, las mismas oportunidades, los mismos criterios para toda persona, sin importar género, idioma, etnia, cargo o comunidad de origen.",
      tabla: [
        { r: "El líder", h: "Ofrece a las colaboradoras la misma información sobre vacantes que a los hombres y les pregunta activamente por sus aspiraciones.", n: "Las oportunidades llegan de manera informal, solo a quienes ya tienen acceso al líder." },
        { r: "El colaborador", h: "Dedica el mismo tiempo y profundidad al crédito de Q3,000 de una señora de la comunidad que al de Q30,000 de un empresario del área urbana.", n: "Atiende diferente según el monto, el idioma o la apariencia del socio." },
        { r: "Con el socio", h: "Cuando una socia solo habla kaqchikel, el personal busca la manera de comunicarse con respeto y claridad. No la atiende de prisa.", n: "Se apresura la atención de socios que hablan idioma indígena porque «toma mucho tiempo»." }
      ],
      ejemplo: "Un martes llegan casi al mismo tiempo un hombre que pide Q28,000 para su ferretería y una señora que viene por Q3,500. El asesor los atiende en orden de llegada, con el mismo tiempo y la misma profundidad. Los dos salen sabiendo exactamente qué firmaron." }
  ],

  principios: [
    { n: "Trato digno a toda persona", lema: "Toda persona que interactúa con ADICLA merece trato respetuoso e inclusivo. Sin excepción.",
      hacemos: ["Me dirijo al socio, al compañero y al proveedor con el mismo respeto, independientemente de quién sea.", "Cuando hay barrera de idioma, busco activamente cómo comunicarme antes de proceder con cualquier trámite.", "Nunca hablo de un socio o de un compañero en términos que lo reduzcan a su condición, cargo o situación."],
      nunca: ["Tratar con más atención a quien tiene mayor cargo o monto de crédito.", "Apurar la atención de un socio porque la comunicación en su idioma toma más tiempo.", "Referirse a socios por su situación financiera o por su etnia en conversaciones internas."] },
    { n: "Honestidad completa", lema: "Decimos la verdad aunque sea incómoda. No omitimos información para quedar bien ni para cerrar una operación más rápido.",
      hacemos: ["Comparto información que otro necesita antes de que me la pida.", "Cuando cometo un error, lo reconozco directamente, sin excusas, y propongo cómo corregirlo.", "Le digo al socio la verdad sobre las condiciones del crédito, aunque eso signifique que no lo tome hoy."],
      nunca: ["Guardar información porque compartirla es incómodo o porque «nadie me la pidió».", "Minimizar un error propio o buscar a quién culpar antes de reconocer mi parte.", "Omitir las cláusulas difíciles para que el socio firme ese día."] },
    { n: "Apoyo al compañero", lema: "En ADICLA no se trabaja en silos. Lo que le pasa a otra agencia o a otra área nos concierne a todos.",
      hacemos: ["Cuando veo que un compañero tiene sobrecarga, ofrezco ayuda sin que nadie me lo pida.", "Comparto con otras agencias lo que aprendo, sin esperar que me lo soliciten.", "Cuando un compañero comete un error, lo apoyo para corregirlo; no lo expongo ante el equipo."],
      nunca: ["Terminar mi parte y desconectarme aunque el compañero esté visiblemente agobiado.", "Guardar conocimiento como ventaja personal o no compartirlo porque «esa agencia no es mi problema».", "Señalar el error de un compañero públicamente antes de hablarlo con él directamente."] },
    { n: "Integridad sin condiciones", lema: "Actuamos con el mismo estándar ético cuando hay supervisión y cuando no la hay. La integridad es para el expediente que nadie va a revisar.",
      hacemos: ["Aplico los mismos pasos del protocolo en campo, en ventanilla y en cualquier agencia, con o sin supervisión.", "Uso los recursos de la institución (tiempo, sistemas, materiales) exclusivamente para el trabajo de ADICLA.", "Cuando enfrento un dilema ético, consulto a mi líder antes de actuar por conveniencia."],
      nunca: ["Tomar atajos en el campo porque «acá nadie me ve».", "Usar el tiempo institucional o los sistemas para asuntos personales.", "Decidir solo lo que me conviene sin consultar cuando el caso no es claro."] },
    { n: "Responsabilidad hasta el final", lema: "Terminamos lo que empezamos. Si algo cambia, avisamos con tiempo suficiente para que alguien más pueda actuar.",
      hacemos: ["Cumplo mis compromisos con el socio, con el equipo y con la institución sin que nadie tenga que recordármelo.", "Cuando veo que algo no va a resultar como se planeó, lo comunico de inmediato; no espero a que sea una crisis.", "Acepto la retroalimentación sobre mi trabajo como información útil para mejorar."],
      nunca: ["Dejar un trámite incompleto porque surgió algo más urgente, sin avisar ni buscar quién lo cubra.", "Guardar silencio sobre un problema porque reportarlo puede tener consecuencias para mí.", "Defender cada resultado como si fuera perfecto o atribuir todo lo que sale mal a factores externos."] },
    { n: "Pertinencia cultural", lema: "Servir bien significa adaptar la forma, nunca el estándar de calidad, a la realidad de cada persona.",
      hacemos: ["Cuando hay barrera de idioma, busco activamente la manera de comunicarme antes de proceder.", "Verifico que el socio comprendió lo que firmó antes de concluir la atención.", "Respeto las prácticas culturales y comunitarias de las comunidades que atendemos."],
      nunca: ["Avanzar un trámite aunque el socio no haya entendido completamente porque «ya se lo expliqué».", "Dar por cerrada una atención porque el socio no preguntó, asumiendo que entendió todo.", "Tratar con menos paciencia a socios cuyas prácticas o idioma son distintos a los que me resultan familiares."] }
  ],

  normasLider: [
    { exige: "Puntualidad en la hora de inicio de la jornada y las reuniones.", cumple: "El líder llega primero o a tiempo. Si llega tarde, lo reconoce sin excusas." },
    { exige: "Llenar correctamente todos los campos del expediente o formulario.", cumple: "El líder no aprueba ni firma documentos que él mismo no llenaría con ese rigor." },
    { exige: "Reportar un error de inmediato cuando se detecta.", cumple: "El líder reporta sus propios errores con la misma velocidad que exige al equipo." },
    { exige: "No usar recursos de la institución para asuntos personales.", cumple: "El líder no usa el tiempo de reunión, el sistema o los materiales para asuntos ajenos al trabajo." },
    { exige: "Tratar con respeto a socios y compañeros, sin importar su cargo.", cumple: "El líder trata con el mismo respeto al colaborador operativo que a un funcionario de mayor jerarquía." }
  ],

  atributosLider: [
    { n: "Lidera con el ejemplo", lema: "El equipo aprende observando al líder, no escuchando sus discursos. Lo que exige al equipo, lo practica él primero.",
      hace: ["Llega a tiempo, cumple sus compromisos y, cuando comete un error, lo reconoce en voz alta sin excusas.", "En una situación difícil aplica los principios del manual antes de buscar la salida cómoda.", "Cuando se equivoca lo dice: «me equivoqué en esto, lo voy a corregir así»."],
      nunca: ["Exigir puntualidad al equipo y llegar tarde él mismo.", "Tratar al equipo con más exigencia cuando hay visitantes de sede y con menos cuando no los hay.", "Minimizar sus propios errores con excusas mientras exige responsabilidad al equipo."],
      ejemplo: "El líder se comprometió a entregar un reporte el miércoles. El martes un imprevisto le impide terminarlo. Llama a coordinación esa misma tarde para avisar." },
    { n: "Desarrolla a su equipo", lema: "No acapara talento. Lo identifica, lo visibiliza y lo impulsa. Tiene una conversación de desarrollo con cada persona cada semestre.",
      hace: ["Al menos una conversación de desarrollo por semestre con cada miembro: de aspiraciones y crecimiento, no de desempeño.", "Cuando identifica talento, lo menciona activamente a coordinación y a Talento Humano.", "A las colaboradoras les pregunta activamente; no espera a que ellas lo planteen."],
      nunca: ["Hablar de crecimiento solo cuando hay una vacante o cuando alguien piensa irse.", "Retener al mejor colaborador porque «lo necesito acá» aunque la persona quiera crecer.", "Asumir que una mujer no quiere ascender porque no lo ha dicho."],
      ejemplo: "En la conversación semestral, la jefa pregunta: ¿hacia dónde quieres ir en ADICLA? A la asesora nunca se lo habían preguntado. Habla diez minutos. La jefa le dice que hay una convocatoria interna, que reúne el perfil y que la va a recomendar." },
    { n: "Garantiza la participación del equipo", lema: "Crea condiciones reales para que cada persona tenga voz, no solo quienes siempre hablan.",
      hace: ["Antes de cambiar cómo trabaja la agencia, consulta al equipo. La consulta ocurre antes de que la decisión esté tomada.", "En cada reunión mensual hay un momento formal para decir qué funciona y qué no.", "Comunica las decisiones institucionales con el contexto completo y abre espacio para preguntas reales."],
      nunca: ["Decidir los cambios y luego «informar» al equipo como si hubieran participado.", "Reuniones solo de información: el líder habla y el equipo escucha.", "Comunicar decisiones difíciles con «así lo decidió la institución, punto»."],
      ejemplo: "Coordinación decide cambiar el horario de atención en dos agencias. El jefe convoca a su equipo dos días antes de confirmarlo, escucha sus inquietudes y las lleva a coordinación antes de implementar el cambio." },
    { n: "Gestiona el error con aprendizaje", lema: "Cuando algo sale mal, la primera pregunta no es «¿quién tiene la culpa?» sino «¿qué pasó y cómo lo evitamos la próxima vez?».",
      hace: ["Primero pregunta: ¿qué pasó y por qué? Después: ¿qué cambiamos?", "Después de analizar el error, establece con el equipo un cambio concreto al proceso.", "Crea un ambiente donde reportar un error temprano es valorado, no castigado."],
      nunca: ["Ir directamente a la consecuencia sin entender la causa.", "Sancionar y seguir adelante sin ajustar el proceso que generó el error.", "Un ambiente donde el equipo prefiere ocultar los errores porque reportarlos cuesta demasiado."],
      ejemplo: "Un expediente llega incompleto a auditoría. El jefe reúne al equipo y hace una sola pregunta: ¿en qué parte del proceso nos falló la revisión? Identifican un paso que se salta con mucha carga. Lo ajustan juntos. No hubo señalados. Hubo un proceso mejor." },
    { n: "Comunica con claridad y oportunidad", lema: "El equipo nunca se entera de algo importante por rumor cuando tiene un líder de ADICLA.",
      hace: ["Cuando llega información que afecta al equipo, la comparte dentro de las 24 horas, con el contexto completo.", "Comunica tanto lo que salió bien como lo que hay que mejorar.", "Cuando una decisión no puede cambiarse, explica el porqué con honestidad."],
      nunca: ["Dejar que el equipo se entere por rumor o contar solo una parte «para no alarmarlos».", "Informar solo los resultados positivos y silenciar los problemas hasta que sean urgentes.", "Escudar las decisiones difíciles con «es política institucional», sin más contexto."],
      ejemplo: "Gerencia comunica un cambio en los requisitos de aprobación. El jefe lo recibe a mediodía. A las 2 de la tarde reúne al equipo, explica el cambio, el contexto y cómo afecta su trabajo ese mismo día. Nadie descubre el cambio cuando un crédito le rebota." },
    { n: "Aplica las normas con equidad", lema: "Las normas aplican de la misma manera a todas las personas. La posición o la antigüedad no generan inmunidad.",
      hace: ["Aplica los mismos criterios a situaciones similares, sin importar quién esté involucrado.", "Las oportunidades de capacitación, proyectos y reconocimiento llegan a todas las agencias, no solo a sede.", "Cuando alguien señala trato desigual, lo atiende con seriedad y sin minimizarlo."],
      nunca: ["Aplicar normas con más rigor a unos que a otros sin justificación objetiva.", "Que las oportunidades circulen de manera informal y solo lleguen a quienes ya tienen acceso.", "Ignorar una queja de trato inequitativo porque la persona «es muy sensible»."],
      ejemplo: "Don Armando llega ocho minutos tarde a la reunión. Dice «perdón, se me hizo tarde», saca el libro de actas y escribe su hora de llegada. El mismo gesto que hace cuando es otra persona la que llega tarde. En esa agencia las normas no son algo que el jefe pide: son algo que el jefe hace." }
  ],

  retrato: [
    { c: "En la reunión del equipo", d: "El lunes el jefe no solo informa: pregunta. Escucha lo que pasó la semana anterior y toma nota. Nadie sale sin saber qué viene esta semana y por qué." },
    { c: "Cuando algo sale mal", d: "Un asesor comete un error. El jefe lo llama a su oficina, cierra la puerta y le pregunta qué pasó. No lo llama la atención frente al equipo. Juntos analizan qué cambiar." },
    { c: "Con el socio", d: "El líder conoce a los socios clave de su comunidad. Cuando hay un problema con un crédito, él mismo acompaña al asesor a resolver." },
    { c: "Con las colaboradoras", d: "Les pregunta, al menos una vez por semestre, hacia dónde quieren crecer. Les da información sobre vacantes al mismo tiempo que a los hombres." }
  ],

  ejes: [
    { n: "Gobernanza y liderazgo", reto: "Que el marco formal se viva de manera consistente en el liderazgo de cada agencia: decisiones transparentes, equipo con voz real y normas con el mismo criterio en todos los niveles.",
      vivo: ["El líder explica el contexto y la razón de las decisiones que afectan al equipo, dentro de las 24 horas.", "Antes de cambiar cómo trabaja la agencia, el líder consulta al equipo, antes de que la decisión esté tomada.", "Las normas se aplican con el mismo criterio a todos los niveles; el líder cumple lo que exige."],
      erosiona: ["Tomar decisiones que afectan al equipo sin consulta ni explicación.", "Aplicar criterios distintos de conducta según el cargo o la antigüedad.", "Que el equipo se entere de novedades institucionales por rumor."],
      ejemplo: "El supervisor regional recibe por correo un cambio de procedimiento. Lo lee dos veces, anota tres preguntas y llama para aclararlas antes de comunicar nada. Al día siguiente convoca una reunión y explica el cambio y el razonamiento. Esa tarde, cada líder hace lo mismo con su equipo." },
    { n: "Gestión de riesgos", reto: "Que la disciplina de control no quede solo en auditores y comités. Reportar un riesgo temprano es un acto de integridad.",
      vivo: ["Cuando un asesor identifica un patrón inusual en su cartera o en la conducta de un socio, lo reporta antes de que sea problema.", "En las reuniones, el líder pregunta: ¿hay alguna señal de alerta que debamos atender esta semana?", "No se penaliza a quien reporta un riesgo de buena fe."],
      erosiona: ["Esperar a que la auditoría identifique algo que era visible en el trabajo cotidiano.", "Inhibir el reporte de riesgos por miedo o porque «no es mi área».", "Tratar la gestión de riesgos como responsabilidad exclusiva del área de control."],
      ejemplo: "Un asesor nota que tres socios del mismo grupo solidario pagaron tarde el mismo mes. Lo lleva a su jefe ese mismo día. Descubren que los tres venden en el mismo mercado, que estuvo cerrado una semana. Lo atienden antes del siguiente vencimiento. El grupo no se fractura." },
    { n: "Auditoría", reto: "Que la cultura de control no inhiba el aprendizaje: un error detectado debe traducirse en mejora, no solo en sanción.",
      vivo: ["Cuando auditoría encuentra un error, el equipo analiza qué ocurrió y qué cambio se necesita antes de determinar consecuencias.", "Después de cada ciclo, el líder comparte los hallazgos como oportunidad de mejora colectiva.", "Reportar un error temprano protege a la institución y al colaborador."],
      erosiona: ["Un ambiente donde el equipo prefiere ocultar errores porque reportarlos cuesta demasiado.", "Usar los resultados de auditoría para señalar públicamente a individuos sin contexto.", "Tratar el control como un fin en sí mismo, desvinculado del aprendizaje."],
      ejemplo: "Auditoría interna detecta que varias agencias omiten un paso del desembolso. En lugar de un correo de llamada de atención, convoca a los jefes a una reunión de análisis: ¿por qué el proceso lo permite? Descubren que el paso es redundante. Lo ajustan en toda ADICLA esa semana." },
    { n: "Transformación digital y tecnología", reto: "Cada cambio tecnológico tiene que sentirse como apoyo, no como amenaza. Nadie se queda atrás sin acompañamiento.",
      vivo: ["Cuando se introduce una herramienta, quienes tienen más experiencia apoyan a quienes están aprendiendo.", "Si no se entiende una herramienta, se pide ayuda. No es debilidad: es responsabilidad profesional.", "Cada cambio se comunica con su propósito: para qué sirve y cómo mejora el trabajo con los socios."],
      erosiona: ["Dejar a colaboradores solos para que descubran herramientas sin acompañamiento.", "Criticar o ridiculizar a compañeros con dificultades tecnológicas.", "Resistir todos los cambios con «siempre lo hemos hecho así»."],
      ejemplo: "Lanzan un nuevo sistema de cartera. El líder nota que dos asesores ya lo dominan y cuatro abren el manual a cada paso. Designa a los dos como referentes de la semana. Al viernes, nadie llamó a soporte." },
    { n: "Desempeño social y ambiental", reto: "Que el propósito se vea en lo concreto: en cómo se trata a cada socio, cómo se mide el éxito y cómo se cuida el entorno.",
      vivo: ["En cada reunión, el líder conecta los resultados de la agencia con el impacto en las familias y comunidades.", "Se reconoce a quien va más allá en el acompañamiento, no solo a quien tiene la cartera más grande.", "Los productos se piensan desde el impacto en la persona y la comunidad."],
      erosiona: ["Tratar la misión social como lenguaje de posicionamiento, desconectada del trabajo cotidiano.", "Reconocer exclusivamente resultados financieros.", "Asumir que el compromiso social del personal es automático y no necesita cultivarse."],
      ejemplo: "En la reunión del lunes, el líder toma cinco minutos para contar que una socia que recibió su primer crédito el año pasado acaba de abrir su segundo punto de venta. «Eso también somos nosotros.» El equipo escucha diferente que cuando escucha indicadores." },
    { n: "Talento humano y ética", reto: "Que las oportunidades lleguen a todas las agencias y a todas las personas, sin importar género, idioma o ubicación.",
      vivo: ["Las conversaciones de desarrollo son práctica regular en todas las agencias, no solo en las cercanas a sede.", "Las oportunidades internas se difunden activamente a todas las personas, con criterios claros.", "Se pregunta a las colaboradoras por sus aspiraciones y se eliminan barreras para que postulen."],
      erosiona: ["Difundir oportunidades informalmente, solo entre quienes tienen acceso cercano a coordinación.", "Aplicar el código ético con diferente rigor según la posición de quien infringe.", "Asumir que las mujeres no quieren crecer porque no lo han planteado."],
      ejemplo: "Se abre una vacante de asesor regional. Antes de enviar el correo solo a jefes de agencia, alguien pregunta: ¿cuántas mujeres en sus agencias podrían postular? Esa pregunta cambia el correo: se envía a todos los equipos con una nota para animar a postular a quien tenga el perfil." },
    { n: "Cumplimiento (LDFT)", reto: "Que el cumplimiento no se viva como burocracia externa sino como parte de la identidad ética: cumplimos porque somos íntegros, no solo porque nos auditan.",
      vivo: ["Cumplimos los protocolos de LDFT con la misma exactitud con o sin supervisión.", "Cuando identificamos una transacción inusual, la reportamos de inmediato, sin importar quién sea el socio.", "El líder explica el propósito detrás de los requisitos de cumplimiento."],
      erosiona: ["Omitir pasos del protocolo por presión de tiempo o por la relación con el socio.", "Tratar el cumplimiento como carga burocrática desconectada de la integridad.", "Reportar de manera diferente según quién sea el socio involucrado."],
      ejemplo: "Un asesor está en la visita final con un socio referido por uno de los socios más antiguos. Es amable y la referencia es de confianza. Pero algo en el origen de fondos no cuadra. Esa misma tarde reporta la inconsistencia a su jefe siguiendo el protocolo. Esa decisión protege a ADICLA y al socio." }
  ],

  herramientas: [
    { id: "queja", grupo: "Protocolos", n: "Cuando el socio tiene una queja", lead: "Un socio que se queja está eligiendo darnos la oportunidad de corregir en lugar de irse.", tipo: "pasos",
      pasos: [
        { t: "Escuchar sin interrumpir", h: "Dejar que el socio exprese su queja completa. Tono neutro y contacto visual.", n: "Interrumpir para corregir o explicar antes de que termine." },
        { t: "Reconocer", h: "Decir con claridad que se entiende la situación y que se lamenta la experiencia, aunque no haya sido responsabilidad directa de quien atiende.", n: "Defenderse, minimizar la queja o trasladar la culpa a otra área o persona." },
        { t: "Resolver o escalar", h: "Si se puede resolver en ese momento, se resuelve. Si no, se explica exactamente a quién va el caso y en qué plazo recibirá respuesta.", n: "Prometer una solución sin saber si se puede cumplir." },
        { t: "Dar seguimiento", h: "Verificar en el plazo acordado que se resolvió. Si no, reportar y escalar hasta que haya respuesta.", n: "Asumir que el socio ya lo resolvió o que otro ya dio seguimiento." }
      ], roles: ["ventanilla", "asesor", "lider"] },
    { id: "error", grupo: "Protocolos", n: "Cuando hay un error operativo", lead: "Esta conversación es para entender, no para sancionar todavía.", tipo: "pasos",
      pasos: [
        { t: "Escuchar sin acusar", h: "Solicita información con tono neutro." },
        { t: "Determinar si es error de proceso o de decisión", h: "Si el proceso lo facilita, hay que cambiar el proceso. Si fue una decisión individual inadecuada, se aborda de manera diferente." },
        { t: "Actuar según la causa", h: "Proceso: lo ajustan juntos y se comparte el aprendizaje. Decisión individual: conversación privada, clara y respetuosa." },
        { t: "Dar seguimiento en el plazo acordado", h: "" }
      ], nunca: ["Llamar la atención frente al equipo.", "Llegar al paso 3 sin haber completado el 1 y el 2."], roles: ["lider", "gerencia"] },
    { id: "conflicto", grupo: "Protocolos", n: "Cuando hay conflicto entre personas del equipo", lead: "La causa superficial rara vez es la causa profunda.", tipo: "pasos",
      pasos: [
        { t: "Escuchar a cada persona por separado", h: "Antes de tomar posición." },
        { t: "Identificar el origen real", h: "La causa superficial rara vez es la causa profunda." },
        { t: "Facilitar una conversación conjunta", h: "Orientada a la solución, no a determinar quién tiene razón." },
        { t: "Seguimiento en 15 días", h: "Verificar que la situación mejoró y que no hay represalias." }
      ], nunca: ["Tomar partido antes de escuchar a las dos partes.", "Ignorar señales de tensión hasta que se convierta en ruptura."], roles: ["lider", "gerencia"] },
    { id: "lider-nuevo", grupo: "Protocolos", n: "Cuando el líder llega nuevo a una agencia", lead: "El equipo tiene historia y conocimiento que necesitas antes de actuar.", tipo: "pasos",
      pasos: [
        { t: "Días 1 a 30: solo escuchar", h: "Observa, pregunta, aprende. Sin cambios todavía." },
        { t: "Días 30 a 60: reconocer", h: "Reconoce en público lo que el equipo ya hace bien. Identifica las fortalezas reales de esa agencia." },
        { t: "Días 60 a 90: primeros cambios", h: "Con el equipo, no a pesar de él." }
      ], nunca: ["Llegar aplicando lo que funcionó en tu agencia anterior sin entender primero la nueva realidad."], roles: ["lider"] },
    { id: "correccion", grupo: "Protocolos", n: "Cuando hay que corregir un comportamiento fuera del estándar", lead: "La corrección cultural no es sanción: es una conversación que le devuelve a la persona la responsabilidad sobre su comportamiento.", tipo: "pasos",
      pasos: [
        { t: "En privado", h: "Tono tranquilo y directo. Nunca frente al equipo." },
        { t: "Describir el comportamiento concreto", h: "No la personalidad: el comportamiento específico que observaste." },
        { t: "Explicar por qué está fuera del estándar", h: "Y qué impacto tiene en el equipo o en el socio." },
        { t: "Preguntar", h: "¿Qué necesita para actuar diferente? ¿Hay algo que dificulta cumplir el estándar?" },
        { t: "Acuerdo concreto con plazo", h: "Un cambio definido y una fecha." },
        { t: "Seguimiento", h: "Si cambió, lo reconoces. Si no, escalas a Talento Humano." }
      ], nunca: ["Llamar la atención frente al equipo.", "Describir con etiquetas personales («eres irresponsable»).", "Hacer un acuerdo sin plazo ni seguimiento."], roles: ["lider", "gerencia"] },
    { id: "denuncia", grupo: "Protocolos", n: "Denuncia confidencial por violencia de género o acoso", lead: "Ninguna persona en ADICLA enfrenta violencia, acoso o discriminación por su género. Ningún cargo da inmunidad.", tipo: "pasos",
      pasos: [
        { t: "Reportar", h: "La persona afectada o testigo reporta al canal confidencial de Talento Humano: en persona, por correo institucional o por el canal que la institución defina." },
        { t: "Acuse de recibo en 48 horas", h: "Talento Humano asigna a la persona responsable de la investigación, verificando que no hay conflicto de interés." },
        { t: "Investigación", h: "Se escucha a las partes por separado y se documentan los hallazgos. Quien reportó recibe información del avance en plazos definidos." },
        { t: "Determinación documentada", h: "Respuesta institucional proporcional al hallazgo." },
        { t: "Comunicación del resultado", h: "Protegiendo la confidencialidad. Si hubo acoso o violencia confirmada, se aplica la consecuencia." }
      ], nunca: ["Disuadir a alguien de reportar.", "Revelar la identidad de quien reportó.", "Tomar represalias contra quien denunció de buena fe.", "Proteger a alguien por su cargo."], roles: ["lider", "asesor", "ventanilla", "gerencia"] },
    { id: "induccion", grupo: "Protocolos", n: "Inducción: los primeros 90 días", lead: "La primera impresión define si el nuevo colaborador siente que pertenece o que es un número más.", tipo: "pasos",
      pasos: [
        { t: "Día 1", h: "El líder directo lo recibe personalmente y lo presenta al equipo por su nombre. Le da tiempo para leer el Manual de Cultura antes del manual de procedimientos y le explica con sus palabras por qué importa." },
        { t: "Días 2 a 5", h: "Acompañamiento cercano del líder o de un par designado. Observa antes de operar. Se explica el porqué de los procesos, no solo el cómo." },
        { t: "Días 6 a 30", h: "Primera conversación formal: ¿cómo vas?, ¿qué ha sido diferente a lo que esperabas?, ¿qué ha sido positivo? Se pregunta por sus aspiraciones desde el primer mes." },
        { t: "Días 31 a 90", h: "Segunda conversación formal: cómo está viviendo los valores en su trabajo concreto. El líder valida, corrige y refuerza." }
      ], nunca: ["Dejar que el nuevo colaborador se presente por su cuenta.", "Entregar el manual y asumir que lo leerá y entenderá solo.", "Asumir que porque trabajó antes en finanzas ya conoce la cultura de ADICLA."], roles: ["lider", "gerencia"] },
    { id: "momentos", grupo: "Servicio al socio", n: "Los cinco momentos del servicio", lead: "El socio nunca sale sin saber el próximo paso.", tipo: "pasos",
      pasos: [
        { t: "Bienvenida", h: "Contacto visual, saludo con su nombre, tono cálido. Si prefiere hablar en su idioma, se busca la forma. No se apresura." },
        { t: "Escucha activa", h: "Dejar de mirar el sistema y escuchar. No interrumpir para guiar hacia la respuesta. Preguntar para entender, no para apresurar." },
        { t: "Orientación o trámite", h: "Lenguaje simple. Verificar comprensión con una pregunta directa: «¿le quedó claro el plazo?», «¿tiene alguna pregunta sobre la cuota?»." },
        { t: "Cierre", h: "Confirmar qué recibió hoy, qué sigue, cuándo y con quién." },
        { t: "Seguimiento", h: "Si algo quedó pendiente, dar seguimiento sin que el socio tenga que preguntar. El compromiso se cumple en el plazo acordado." }
      ], roles: ["ventanilla", "asesor"] },
    { id: "servicio", grupo: "Servicio al socio", n: "Estándar de servicio al socio", lead: "Siempre y nunca, en cualquier agencia.", tipo: "parejas",
      parejas: [
        { h: "Saludo al socio por su nombre si lo conozco, antes de preguntar por el trámite.", n: "Comenzar la atención pidiendo documentos antes de reconocer a la persona." },
        { h: "Me tomo el tiempo que el socio necesita para entender, no el que me conviene.", n: "Apurar al socio o hacerle sentir que su trámite es una carga." },
        { h: "Explico en lenguaje simple y verifico comprensión antes de que firme.", n: "Usar términos técnicos sin verificar que los entiende." },
        { h: "Si no puedo resolver algo, oriento sobre quién puede y cómo llegar.", n: "Dejar al socio sin una respuesta clara." },
        { h: "Cierro toda atención confirmando el próximo paso y el plazo concreto.", n: "Atender diferente según el monto, la apariencia o el idioma del socio." }
      ], roles: ["ventanilla", "asesor"] },
    { id: "canales", grupo: "Comunicación", n: "¿Qué canal uso?", lead: "Cada canal sirve para algo y hay cosas para las que nunca se usa.", tipo: "canales",
      canales: [
        { c: "WhatsApp grupal", para: "Avisos urgentes del día y coordinación inmediata entre agencias.", tiempo: "Respuesta en máximo 2 horas en horario laboral.", nunca: "Correcciones al equipo. Información confidencial de socios. Discusiones largas." },
        { c: "Correo institucional", para: "Comunicaciones formales, envío de documentos y acuerdos que necesitan registro escrito.", tiempo: "Respuesta en máximo 24 horas en días laborales.", nunca: "Urgencias reales. Conversaciones que requieren intercambio rápido." },
        { c: "Reunión de equipo", para: "Decisiones importantes, problemas complejos, retroalimentación y coordinación entre áreas.", tiempo: "Planificada con agenda al menos 24 horas antes.", nunca: "Asuntos que se resuelven con un mensaje." },
        { c: "Llamada directa", para: "Urgencias que no admiten espera. Temas donde el tono importa y puede malinterpretarse por escrito.", tiempo: "Inmediata.", nunca: "Comunicaciones formales que necesitan registro." }
      ],
      guia: [
        { q: "Un aviso urgente de hoy o coordinar algo ahora con otra agencia", a: "WhatsApp grupal" },
        { q: "Un documento, un acuerdo o algo que debe quedar por escrito", a: "Correo institucional" },
        { q: "Una decisión importante, un problema complejo o retroalimentación al equipo", a: "Reunión de equipo" },
        { q: "Una urgencia real o un tema donde el tono importa", a: "Llamada directa" },
        { q: "Corregir a alguien del equipo", a: "Conversación en privado, cara a cara. Nunca por WhatsApp ni frente al equipo." },
        { q: "Información confidencial de un socio", a: "Nunca por WhatsApp grupal." }
      ], roles: ["lider", "asesor", "ventanilla", "gerencia"] },
    { id: "reunion", grupo: "Liderazgo", n: "La reunión mensual de equipo", lead: "No se cancela cuando hay mucho trabajo. Es especialmente necesaria cuando hay mucho trabajo. 45 a 55 minutos, todos los meses.", tipo: "reunion",
      momentos: [
        { t: "Resultados del mes", min: 10, d: "El líder comparte resultados: no solo números, también cómo estuvieron con los socios y qué situaciones complejas surgieron." },
        { t: "Momento cultural", min: 10, d: "Un valor, una situación real del mes o una historia de la agencia: ¿cómo vivimos esto?" },
        { t: "Voz del equipo", min: 15, d: "Turno del equipo. Dos preguntas: ¿qué está funcionando bien? y ¿qué necesitamos mejorar? El líder escucha y registra." },
        { t: "Seguimiento de compromisos", min: 10, d: "¿Qué acordamos el mes pasado? ¿Se cumplió? ¿Qué nos comprometemos hoy?" },
        { t: "Información institucional", min: 10, d: "Novedades que el equipo necesita conocer: cambios, nuevos productos, fechas clave." }
      ], roles: ["lider"] },
    { id: "desarrollo", grupo: "Liderazgo", n: "La conversación de desarrollo semestral", lead: "30 minutos dedicados exclusivamente a la persona y a su crecimiento. El líder la agenda; no espera a que se la pidan. Con las colaboradoras no es opcional ni informal.", tipo: "preguntas",
      preguntas: [
        { q: "¿Hacia dónde quieres crecer dentro de ADICLA?", a: "Registra la aspiración y la comparte con Talento Humano cuando hay una oportunidad concreta." },
        { q: "¿Qué está facilitando tu desarrollo?", a: "Fortalece activamente esas condiciones." },
        { q: "¿Qué te lo está dificultando?", a: "Si está en su mano, actúa. Si no, lo lleva a quien puede actuar." },
        { q: "¿Qué puede hacer ADICLA para apoyarte mejor?", a: "Lleva la respuesta como insumo real a Talento Humano." }
      ], roles: ["lider", "gerencia"] },
    { id: "estandares", grupo: "Liderazgo", n: "Los cinco estándares mínimos de cada agencia", lead: "Son el piso, no el techo. Marca cómo está tu agencia hoy.", tipo: "checklist",
      items: [
        { t: "Reunión mensual de equipo todos los meses, sin cancelar", d: "45 a 55 minutos con la estructura definida.", alerta: "La reunión se cancela cuando «hay mucho trabajo»." },
        { t: "Toda retroalimentación de desempeño ocurre en privado", d: "Nunca se corrige a un colaborador frente al equipo.", alerta: "El jefe llama la atención en la reunión, en el pasillo o por grupo de WhatsApp." },
        { t: "Toda comunicación importante llega en menos de 24 horas, con contexto", d: "El mismo día o al día siguiente, con el contexto disponible.", alerta: "El equipo se entera por rumor o semanas después de que el jefe ya lo sabía." },
        { t: "Conversación de desarrollo semestral para cada colaborador", d: "30 minutos individuales dedicados a su crecimiento.", alerta: "Solo hay conversaciones individuales cuando hay un problema." },
        { t: "Las normas aplican igual al jefe que al equipo", d: "Sin excepciones en puntualidad, reportes ni uso de recursos.", alerta: "El equipo percibe una norma para ellos y otra no escrita para quien los lidera." }
      ], roles: ["lider", "gerencia"] },
    { id: "calendario", grupo: "Cultura viva", n: "Calendario cultural anual", lead: "Lo que ocurre cada año, en todas las agencias.", tipo: "calendario",
      meses: [
        { m: "Enero", t: "Inicio de año", d: "Cada líder revisa con su equipo los compromisos del manual: acuerdos del año anterior y compromisos culturales del año.", r: "Líderes de agencia con apoyo de Talento Humano" },
        { m: "Marzo", t: "Mes de la Mujer", d: "Conversación en cada agencia sobre los compromisos de género: ¿cómo estamos?, ¿qué barreras seguimos viendo? Conversación genuina, no taller formal.", r: "Líderes de agencia" },
        { m: "Junio", t: "Revisión semestral", d: "El Comité revisa el avance del primer semestre y ajusta si es necesario.", r: "Comité de Talento y Cultura" },
        { m: "Agosto", t: "Conversaciones de desarrollo", d: "Todos los líderes tienen la conversación semestral con cada miembro de su equipo. Talento Humano verifica.", r: "Líderes de agencia, coordinado por Talento Humano" },
        { m: "Octubre", t: "Día de la Cultura", d: "Reconocimiento institucional de personas y agencias que vivieron los valores de manera sobresaliente. Público y celebrado.", r: "Gerencia General y Talento Humano" },
        { m: "Diciembre", t: "Cierre", d: "El Comité presenta a la Junta Directiva el estado cultural. Se renueva el compromiso para el siguiente año.", r: "Comité y Gerencia General" }
      ], roles: ["lider", "gerencia"] },
    { id: "integracion", grupo: "Cultura viva", n: "Actividades de integración", lead: "La cohesión no es un lujo. Es infraestructura cultural.", tipo: "actividades",
      agencia: [
        { a: "Momento de reconocimiento informal", f: "Semanal, en la reunión de equipo", d: "El líder o un compañero nombra algo concreto que alguien hizo bien esa semana." },
        { a: "Celebración de cumpleaños e hitos personales", f: "Según ocurran", d: "Un mensaje del equipo o un momento en la reunión: la persona importa más allá de su rol." },
        { a: "Almuerzo o convivio de equipo", f: "Trimestral", d: "Tiempo para conocerse como personas. El líder asiste pero no preside." },
        { a: "Voluntariado comunitario", f: "Anual, por agencia", d: "Una jornada de apoyo en una comunidad que sirven. Conecta al equipo con el propósito real de ADICLA." }
      ],
      entre: [
        { a: "Encuentro de buenas prácticas entre agencias", f: "Semestral", d: "Dos o tres agencias comparten en 90 minutos una situación real donde aplicaron bien los valores. El Comité facilita." },
        { a: "Intercambio de colaboradores entre agencias", f: "Anual", d: "Un colaborador pasa un día acompañando a un compañero de otra agencia. No es auditar: es conocerse y aprender." },
        { a: "Día de la Cultura ADICLA", f: "Anual, en octubre", d: "Todas las 11 agencias en un espacio de celebración institucional. Se reconocen los logros culturales del año." }
      ], roles: ["lider", "gerencia"] },
    { id: "alertas", grupo: "Cultura viva", n: "Señales de alerta y quién actúa", lead: "Estas señales no son motivo de sanción automática: son información que necesita atención.", tipo: "parejas2",
      parejas: [
        { h: "Un líder toma decisiones sin consultar al equipo de manera sistemática.", n: "El superior directo inicia una conversación de retroalimentación con el capítulo de liderazgo como base." },
        { h: "Los mismos colaboradores siempre hablan en las reuniones y el resto nunca.", n: "El líder revisa el formato de la reunión mensual y activa mecanismos de participación." },
        { h: "Se reportan diferencias de trato según género, idioma o cargo.", n: "Talento Humano y el Comité investigan y actúan dentro de 30 días." },
        { h: "Una agencia muestra una cultura significativamente distinta de manera persistente.", n: "El Comité revisa su perfil y propone una intervención específica." },
        { h: "Las acciones de género no se ejecutan o no tienen seguimiento.", n: "El Comité revisa los cuatro compromisos y propone ajustes concretos." },
        { h: "Los indicadores del Tablero Cultural no mejoran.", n: "El Comité diseña una intervención por agencia y dimensión, con responsables y plazos." }
      ], roles: ["lider", "gerencia"] },
    { id: "orgullo", grupo: "Cultura viva", n: "Señales de orgullo de pertenecer", lead: "El orgullo ya existe en ADICLA. La tarea es alimentarlo, visibilizarlo y que no se erosione.", tipo: "parejas3",
      parejas: [
        { h: "El colaborador habla de ADICLA con orgullo fuera del trabajo.", n: "Evita mencionar dónde trabaja o lo hace sin entusiasmo." },
        { h: "Ante un problema con un socio, lo resuelve aunque no sea estrictamente su área.", n: "Dice «ese no es mi problema» o espera a que alguien más actúe." },
        { h: "El personal nuevo siente que pertenece desde la primera semana.", n: "Pasa semanas sin que nadie le explique nada ni le presente al equipo." },
        { h: "Los colaboradores proponen mejoras sin miedo a que las descarten.", n: "Nadie propone nada porque «aquí las cosas siempre han sido así»." },
        { h: "En una celebración institucional la gente llega con ganas y participa.", n: "Las actividades se viven como obligación, no como celebración." }
      ], roles: ["lider", "gerencia", "asesor", "ventanilla"] },
    { id: "indicadores", grupo: "Cultura viva", n: "Tablero de indicadores culturales", lead: "La cultura sin medición es declaración. Metas a 18 meses, revisadas cada semestre por el Comité de Talento y Cultura.", tipo: "indicadores",
      items: [
        { n: "Índice Cultural Global", hoy: "4.02 / 5.00", meta: "≥ 4.30 / 5.00", r: "Comité de Talento y Cultura", pct: 80, pctMeta: 86 },
        { n: "Favorabilidad de liderazgo cultural", hoy: "42.1 %", meta: "≥ 65 %", r: "Talento Humano", pct: 42, pctMeta: 65 },
        { n: "Participación decisional del personal", hoy: "3.29 / 5.00", meta: "≥ 3.80 / 5.00", r: "Líderes de agencia", pct: 66, pctMeta: 76 },
        { n: "Variabilidad cultural entre agencias", hoy: "0.83 puntos", meta: "≤ 0.40 puntos", r: "Comité de Talento y Cultura", menor: true },
        { n: "Brecha conocimiento-modelamiento", hoy: "1.16 puntos", meta: "≤ 0.60 puntos", r: "Jefaturas", menor: true }
      ],
      nota: "Una agencia que no mejora sus indicadores no recibe una llamada de atención. Recibe atención: el Comité revisa el perfil, identifica la causa y diseña una intervención. El seguimiento cultural no es sanción, es acompañamiento.",
      fases: [
        { f: "Fase I · Activación", m: "Meses 0 a 6", foco: "Liderazgo cultural", acciones: "Constituir el Comité de Talento y Cultura · Diagnóstico de estilos de liderazgo por agencia · Formación de líderes · Lanzamiento del manual · Contratos de desempeño cultural para jefaturas." },
        { f: "Fase II · Integración", m: "Meses 3 a 12", foco: "Participación y territorio", acciones: "Protocolo de participación decisional · Programa de Liderazgo ADICLA (mujeres) · Intervención en agencias en riesgo · Replicar el modelo de liderazgo de San Juan Comalapa." },
        { f: "Fase III · Medición", m: "Meses 12 a 18", foco: "Verificación y ajuste", acciones: "Segundo ciclo de medición con el mismo instrumento de 58 ítems · Evaluación del Comité · Ajuste del manual · Presentación a Junta Directiva." }
      ], roles: ["gerencia", "lider"] },
    { id: "honor", grupo: "Liderazgo", n: "Código de Honor Gerencial", lead: "Un código de honor no se enmarca en la pared: se graba en las decisiones de cada día.", tipo: "lista",
      items: [
        { t: "Razón de ser y propósito", d: "Ser agente de cambio para mejorar la vida de las familias y cuidar con integridad el tiempo, los recursos y las personas." },
        { t: "Gratitud y pregunta diaria", d: "Agradecer la oportunidad de servir y preguntarse cada día cómo contribuirá a transformar la vida de al menos cinco familias." },
        { t: "Comunicación con clientes y colaboradores", d: "Trato respetuoso, claro y empático; conocer a las personas por su nombre y brindar educación financiera para un endeudamiento responsable." },
        { t: "Uso responsable de la tecnología y la IA", d: "Apoyarse en datos e inteligencia artificial sin sustituir el juicio humano, asegurando resultados éticos y veraces." },
        { t: "Manejo efectivo del tiempo", d: "Priorizar, reunir con agenda y tiempos definidos, y delegar como forma de formar nuevos líderes." },
        { t: "Liderazgo con el ejemplo", d: "Liderar dando el ejemplo, interesarse por el equipo y garantizar su bienestar integral." }
      ], roles: ["lider", "gerencia"] },
    { id: "genero", grupo: "Género", n: "Los cuatro compromisos de género", lead: "La igualdad de género no es un tema paralelo a la cultura de ADICLA: es parte de su propósito. Avance reportado cada semestre al Comité y a la Gerencia.", tipo: "genero",
      compromisos: [
        { t: "Reclutamiento con balance de género", d: "Convocatorias con lenguaje neutro («Asesor o Asesora de Crédito»). Difusión en comunidades, grupos de mujeres y redes cercanas a cada agencia. Criterios documentados antes de entrevistar. Formación del entrevistador en sesgos inconscientes.", nunca: "Preguntas que nunca se hacen en una entrevista: estado civil o planes de matrimonio; si tiene hijos, si planea tenerlos o quién los cuida; cualquier pregunta que no se haría a un candidato hombre." },
        { t: "Cadena de valor con enfoque de género", d: "Conocer con datos a las socias: cartera por género, barreras de acceso, horarios problemáticos y diferencias en tiempo de atención o explicación entre mujeres y hombres." },
        { t: "Productos para las necesidades de las mujeres", d: "Montos adecuados a la escala del negocio femenino, garantías flexibles o alternativas, horarios y modalidades accesibles, condiciones explicadas en lenguaje simple." },
        { t: "Prevención de violencia de género y acoso", d: "Tres sesiones obligatorias: qué es la violencia y el acoso de género, la política de cero tolerancia de ADICLA, y el mecanismo de denuncia confidencial." }
      ],
      diaadia: [
        { h: "Usa lenguaje inclusivo: el equipo, todas y todos.", n: "Usar el género masculino como referencia universal." },
